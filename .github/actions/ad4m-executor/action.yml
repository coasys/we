name: AD4M executor
description: The ad4m executor binary for one ad4m commit — restored from the cache, or downloaded from ad4m's CI, or built — and cached.

# One recipe, one cache key and one path for every workflow that needs an executor. They were two:
# `electron-package.yaml` built one to package and `ad4m-live.yaml` built another to test, under
# different keys and paths, so neither could restore what the other had built and the tests ran a
# different binary from the one the app ships.
#
# The binary lands at `<parent of the workspace>/ad4m/target/release/ad4m-executor`, beside the WE
# checkout, where `we-seed.json`'s `../ad4m/target/release/ad4m-executor` finds it. That path is part
# of the cache's version as well as its location: a restore naming any other path misses an entry
# that is there. `AD4M_DIR` is exported for the steps after this one.
#
# Caches are scoped by branch: a run reads its own branch's and its base branch's, never another
# PR's. An executor cached on `dev` serves every PR; one built on a PR serves only re-runs of it.

inputs:
  ref:
    description: ad4m branch, tag, ref or commit. Empty means the commit the ad4m pin stands for (scripts/ad4m-pin.mjs).
    default: ''
  mode:
    description: >-
      `build` restores, or on a miss downloads the executor ad4m's CI published for the commit, or
      builds it, and caches it. `restore` restores and fails on a miss.
      `lookup` only says whether it is cached, downloading nothing.
    default: build
  v8-from-source:
    description: Build V8 from source — macOS, where the prebuilt archive does not exist.
    default: 'false'

outputs:
  sha:
    description: The ad4m commit.
    value: ${{ steps.where.outputs.sha }}
  path:
    description: Where the binary is, or would be.
    value: ${{ steps.where.outputs.path }}
  cache-hit:
    description: Whether it was already cached.
    value: ${{ steps.lookup.outputs.cache-hit || steps.restore.outputs.cache-hit }}

runs:
  using: composite
  steps:
    # The executor has to match the SDK the app was tested against, which is the pinned
    # @coasys/ad4m, so the commit the pin stands for is what gets built — not ad4m `dev`, which moves
    # without WE changing. `scripts/ad4m-pin.mjs` says which commit that is: a snapshot names it in
    # its URL, and a version by the `gitHead` npm recorded. A branch or tag is resolved to its commit
    # here, without a checkout, so the cache key is always a commit.
    - name: Resolve the ad4m commit
      id: where
      shell: bash
      env:
        REF: ${{ inputs.ref }}
      run: |
        if [ -z "$REF" ]; then
          SHA="$(node scripts/ad4m-pin.mjs --commit)"
          echo "The ad4m pin stands for $SHA"
        elif [[ "$REF" =~ ^[0-9a-f]{40}$ ]]; then
          SHA="$REF"
        else
          SHA="$(git ls-remote https://github.com/coasys/ad4m.git "$REF" | head -1 | cut -f1)"
          if [ -z "$SHA" ]; then
            echo "::error::No ad4m ref named $REF."
            exit 1
          fi
          echo "ad4m $REF is at $SHA"
        fi
        DIR="$(dirname "$GITHUB_WORKSPACE")/ad4m"
        echo "AD4M_DIR=$DIR" >> "$GITHUB_ENV"
        {
          echo "sha=$SHA"
          echo "dir=$DIR"
          echo "path=$DIR/target/release/ad4m-executor"
          echo "key=ad4m-executor-${RUNNER_OS}-${RUNNER_ARCH}-$SHA"
        } >> "$GITHUB_OUTPUT"

    - name: Is it cached
      id: lookup
      if: inputs.mode == 'lookup'
      uses: actions/cache/restore@v6
      with:
        path: ${{ steps.where.outputs.path }}
        key: ${{ steps.where.outputs.key }}
        lookup-only: true

    - name: Restore the executor
      id: restore
      if: inputs.mode != 'lookup'
      uses: actions/cache/restore@v6
      with:
        path: ${{ steps.where.outputs.path }}
        key: ${{ steps.where.outputs.key }}
        fail-on-cache-miss: ${{ inputs.mode == 'restore' }}

    # On a miss, the executor ad4m's own CI built for this commit, downloaded rather than compiled:
    # ad4m publishes one for every pushed commit (CircleCI's `build` job), and a download takes
    # seconds where a build takes most of an hour. scripts/ad4m-executor-download.mjs finds it from
    # the commit alone, with no credentials, and writes it only once its sha256 matches the manifest.
    # Anything that leaves nothing to download — a commit built before ad4m published executors, or
    # whose artifacts have expired — falls through to the build below, as before. Linux x64 only,
    # the one platform ad4m publishes; macOS still builds. Saved to the cache like a built one, so
    # every run after the first restores it and nothing depends on ad4m's artifacts lasting.
    - name: Node for the download
      if: inputs.mode == 'build' && steps.restore.outputs.cache-hit != 'true' && runner.os == 'Linux' && runner.arch == 'X64'
      uses: actions/setup-node@v7
      with:
        # zstd in node:zlib, which is what ad4m compresses with.
        node-version: 24
    - name: Download the executor ad4m built
      id: download
      if: inputs.mode == 'build' && steps.restore.outputs.cache-hit != 'true' && runner.os == 'Linux' && runner.arch == 'X64'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
        SHA: ${{ steps.where.outputs.sha }}
        DEST: ${{ steps.where.outputs.path }}
      run: node scripts/ad4m-executor-download.mjs "$SHA" "$DEST" >> "$GITHUB_OUTPUT"

    # Everything below runs only to build: on a hit or a download, none of it is needed — not even
    # the source.

    # A manual fetch rather than `actions/checkout`, which documents `path` as under the workspace.
    # GitHub serves any commit by hash, so the fetch is shallow whatever the ref was.
    - name: Check out ad4m
      if: inputs.mode == 'build' && steps.restore.outputs.cache-hit != 'true' && steps.download.outputs.downloaded != 'true' && steps.download.outputs.downloaded != 'true'
      shell: bash
      env:
        DIR: ${{ steps.where.outputs.dir }}
        SHA: ${{ steps.where.outputs.sha }}
      run: |
        git init -q "$DIR"
        git -C "$DIR" fetch -q --depth 1 https://github.com/coasys/ad4m.git "$SHA"
        git -C "$DIR" checkout -q FETCH_HEAD

    # ALSA headers for `alsa-sys`; ninja and Python for the V8 source build on macOS.
    - name: Build dependencies (Linux)
      if: inputs.mode == 'build' && steps.restore.outputs.cache-hit != 'true' && steps.download.outputs.downloaded != 'true' && runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake protobuf-compiler libasound2-dev
    - name: Build dependencies (macOS)
      if: inputs.mode == 'build' && steps.restore.outputs.cache-hit != 'true' && steps.download.outputs.downloaded != 'true' && runner.os == 'macOS'
      shell: bash
      run: brew install cmake protobuf ninja
    - name: Python (macOS)
      if: inputs.mode == 'build' && steps.restore.outputs.cache-hit != 'true' && steps.download.outputs.downloaded != 'true' && runner.os == 'macOS'
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'

    # The version comes from ad4m's own `rust-toolchain.toml`, which rustup would honour over anything
    # pinned here anyway — so it follows ad4m instead of going stale. rustup is preinstalled on both
    # runner images.
    - name: Rust toolchain
      if: inputs.mode == 'build' && steps.restore.outputs.cache-hit != 'true' && steps.download.outputs.downloaded != 'true' && steps.download.outputs.downloaded != 'true'
      shell: bash
      working-directory: ${{ steps.where.outputs.dir }}
      run: rustup toolchain install

    # ad4m's build.rs downloads alliance.dna with a bare `curl` (no --retry), and a transient GitHub
    # 504 used to kill a 40-minute build. curl reads ~/.curlrc, so that one download retries without
    # the whole cargo build being retried — which, on a genuine compile error, only fails the same way
    # again. Cargo's own fetches retry through CARGO_NET_RETRY.
    - name: Retry transient downloads
      if: inputs.mode == 'build' && steps.restore.outputs.cache-hit != 'true' && steps.download.outputs.downloaded != 'true' && steps.download.outputs.downloaded != 'true'
      shell: bash
      run: printf 'retry = 5\nretry-connrefused\nretry-delay = 10\n' >> ~/.curlrc

    # The executor embeds `rust-executor/dapp/dist/` via `include_dir!` at compile time — the ad4m
    # launcher's own UI, gitignored and normally built by `pnpm build-libs` across the whole ad4m JS
    # workspace. WE starts the executor with `--run-dapp-server false`, so the binary only needs the
    # directory to exist, and a placeholder satisfies the macro.
    - name: dapp placeholder
      if: inputs.mode == 'build' && steps.restore.outputs.cache-hit != 'true' && steps.download.outputs.downloaded != 'true' && steps.download.outputs.downloaded != 'true'
      shell: bash
      env:
        DIR: ${{ steps.where.outputs.dir }}
      run: |
        mkdir -p "$DIR/rust-executor/dapp/dist"
        echo '<html><body>AD4M</body></html>' > "$DIR/rust-executor/dapp/dist/index.html"

    # Two stages. The Deno V8 snapshot is gitignored and `include_bytes!`-ed by the library, so it is
    # generated first, by a binary behind the `generate_snapshot` feature. Then only the executor:
    # `-p ad4m --bin ad4m-executor` builds the cli crate and what it needs — not the Tauri launcher,
    # not the languages, not the SDK.
    #
    # Linux needs glibc 2.38 or later to link: the prebuilt V8 calls `__isoc23_*`. The hosted
    # Ubuntu 24.04 image has 2.39; ad4m's own 22.04 CI image does not (coasys/ad4m#1305).
    - name: Generate the Deno snapshot
      if: inputs.mode == 'build' && steps.restore.outputs.cache-hit != 'true' && steps.download.outputs.downloaded != 'true' && steps.download.outputs.downloaded != 'true'
      shell: bash
      working-directory: ${{ steps.where.outputs.dir }}/rust-executor
      env:
        V8_FROM_SOURCE: ${{ inputs.v8-from-source == 'true' && '1' || '' }}
        CARGO_NET_RETRY: '10'
      run: cargo run --release --features generate_snapshot --bin generate_snapshot

    - name: Build the executor
      if: inputs.mode == 'build' && steps.restore.outputs.cache-hit != 'true' && steps.download.outputs.downloaded != 'true' && steps.download.outputs.downloaded != 'true'
      shell: bash
      working-directory: ${{ steps.where.outputs.dir }}
      env:
        V8_FROM_SOURCE: ${{ inputs.v8-from-source == 'true' && '1' || '' }}
        CARGO_NET_RETRY: '10'
      run: cargo build --release -p ad4m --bin ad4m-executor

    # Saved as soon as it exists, so a later failure in the calling job does not throw it away.
    - name: Save the executor
      if: inputs.mode == 'build' && steps.restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ${{ steps.where.outputs.path }}
        key: ${{ steps.where.outputs.key }}
