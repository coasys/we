# What a PR is not done with yet.
#
# Two checks:
#
# - Unticked boxes in the description are things the PR says are not done.
# - The ad4m pin says whether the PR is waiting on ad4m: a PR that needs an ad4m change pins that
#   ad4m pull request's snapshot, and must not merge until the change is on ad4m `dev`.
#
# Runs on `edited` as well as the usual pushes, so ticking the last box clears the check without
# needing a commit — otherwise the only way to go green is to push something, and people push
# something.
#
# The task check skips drafts on purpose. A draft is work in progress and its boxes are a plan; the
# check belongs at `ready_for_review`, which is also when the convention says the description is
# written.
#
# The pin gate does NOT skip them. A job skipped by its `if` counts as PASSING a required check, and
# marking a draft ready does not change its commit — so a skipped gate on a draft read as green from
# the click until the `ready_for_review` run was queued, and the merge button was live.
#
# `workflow_dispatch` is for the ad4m bump bot, and runs the pin gate only. A PR the bot opens with
# GITHUB_TOKEN starts no workflows, so it starts the ones whose checks are required itself — and a
# required check that never reports blocks the merge for good.
name: PR tasks

on:
  pull_request:
    types: [opened, edited, reopened, synchronize, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

# One run per PR at a time, and none cancelled. A push and a description edit seconds apart start
# two runs, and the group does not always order them as they were created: with cancel-in-progress
# the one GitHub then took as the check's result was the cancelled one, and a cancelled required
# check blocks the merge with a passing run beside it on the same commit. The jobs take seconds, so
# waiting costs nothing, and each reads the PR as it is when it runs rather than as its event saw it.
concurrency:
  group: pr-tasks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  unticked:
    name: Every task is ticked
    if: ${{ github.event_name == 'pull_request' && !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            scripts/pr-tasks.mjs
            scripts/pr-tasks.test.mjs
          sparse-checkout-cone-mode: false
      # The parser's own tests, here because the root has no test runner to put them in — and a
      # parser that silently stopped recognising a box would pass every PR.
      - name: The parser still recognises what GitHub recognises
        run: node --test scripts/pr-tasks.test.mjs
      # The description as it is now, not as the event carried it: runs are not cancelled, so the
      # run for an earlier event can finish after a later edit, and would grade the old boxes.
      - name: Check the description's tasks
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq '.body // ""' > "$RUNNER_TEMP/body.md"
          node scripts/pr-tasks.mjs "$RUNNER_TEMP/body.md"

  # The merge gate for the ad4m pin, read from the pin and nothing else. A PR that needs an ad4m
  # change pins that ad4m PR's head snapshot, so its preview, CI and live tests all run against the
  # change it needs; this holds it until the change is on ad4m `dev`, and stops a PR started on an
  # older ad4m from moving `dev`'s pin backwards. scripts/ad4m-gate.mjs has the rules.
  #
  # The name is the one branch protection requires, kept from when the gate read a block in the
  # description instead. An ad4m PR merging starts nothing here, so the bump workflow's hourly
  # `ready` job re-runs this check on a PR whose pin it now admits.
  unpaired:
    name: Not waiting on ad4m
    runs-on: ubuntu-latest
    # To put the `waiting on ad4m` label on the PR while it pins an ad4m change not on ad4m `dev`:
    # `issues` to define the label, `pull-requests` to add it to a PR, which `issues` alone is refused.
    # A fork's token cannot write either; the gate then warns, and the bump workflow's hourly job
    # sets it.
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            package.json
            pnpm-lock.yaml
            scripts/ad4m-pin.mjs
            scripts/ad4m-pin.test.mjs
            scripts/ad4m-gate.mjs
            scripts/ad4m-gate.test.mjs
          sparse-checkout-cone-mode: false
      # The reader's and the gate's own tests, here because the root has no test runner to put them
      # in — and a reader that silently misread a pin would admit the wrong ad4m everywhere at once.
      - name: The pin reader and the gate still say what they should
        run: node --test scripts/ad4m-pin.test.mjs scripts/ad4m-gate.test.mjs
      - name: Check the ad4m pin
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.pull_request.base.ref }}
          PR: ${{ github.event.pull_request.number }}
          BRANCH: ${{ github.ref_name }}
        run: |
          # Dispatched, there is no PR in the event: the PR is the one open from this branch, and its
          # base is what the pin is judged against. With none there is nothing that could merge.
          if [ -z "$BASE" ]; then
            OPEN="$(gh api "repos/$GITHUB_REPOSITORY/pulls?head=${GITHUB_REPOSITORY_OWNER}:$BRANCH&state=open" --jq '.[0] | select(.) | "\(.base.ref) \(.number)"')"
            if [ -z "$OPEN" ]; then
              echo "No open PR from $BRANCH, so nothing to judge the pin against."
              exit 0
            fi
            read -r BASE PR <<< "$OPEN"
          fi
          node scripts/ad4m-gate.mjs --base "$BASE" --pr "$PR"
