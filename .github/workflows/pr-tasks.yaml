# What a PR description says is not done yet.
#
# Two checks, both read from the description alone:
#
# - Unticked boxes are things the PR says are not done.
# - A pairing block (`Paired with: coasys/ad4m#N`) says the PR needs an ad4m change the pin does
#   not have yet — the one thing that must not merge.
#
# Runs on `edited` as well as the usual pushes, so ticking the last box, or removing the block
# after `pnpm bump:ad4m`, clears the check without needing a commit — otherwise the only way to go
# green is to push something, and people push something.
#
# The task check skips drafts on purpose. A draft is work in progress and its boxes are a plan; the
# check belongs at `ready_for_review`, which is also when the convention says the description is
# written.
#
# The pairing gate does NOT skip them. A job skipped by its `if` counts as PASSING a required check,
# and marking a draft ready does not change its commit — so a skipped gate on a paired draft read as
# green from the click until the `ready_for_review` run was queued, and the merge button was live.
#
# `workflow_dispatch` is for the ad4m bump bot, and runs the pairing gate only. A PR the bot opens
# with GITHUB_TOKEN starts no workflows, so it starts the ones whose checks are required itself —
# and a required check that never reports blocks the merge for good.
name: PR tasks

on:
  pull_request:
    types: [opened, edited, reopened, synchronize, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-tasks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unticked:
    name: Every task is ticked
    if: ${{ github.event_name == 'pull_request' && !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/pr-tasks.mjs
            scripts/pr-tasks.test.mjs
          sparse-checkout-cone-mode: false
      # The parser's own tests, here because the root has no test runner to put them in — and a
      # parser that silently stopped recognising a box would pass every PR.
      - name: The parser still recognises what GitHub recognises
        run: node --test scripts/pr-tasks.test.mjs
      - name: Check the description's tasks
        env:
          EVENT_BODY: ${{ github.event.pull_request.body }}
        run: node scripts/pr-tasks.mjs

  # The merge gate for a paired PR. Before it, the only thing stopping one merging was that pairing
  # usually turns the pinned checks red — which holds for a PR calling a new SDK method, and not for
  # one depending on how ad4m behaves (a fix, a change to the executor only), or one that declares
  # the new API itself to compile against the pin. Those are green on the pin and merged as freely
  # as anything else, onto a `dev` whose ad4m does not have what they need.
  #
  # So the gate is the description's own claim, not a guess at what the code needs: while it says
  # the PR needs an unpublished ad4m change, it does not merge. Nothing here builds from another
  # repository, so a branch in ad4m still never decides whether a WE change merges — the author's
  # block does. The parser is the one the preview and the paired check read, so the three cannot
  # disagree about whether a PR is paired; a block it cannot read fails here too.
  unpaired:
    name: Not waiting on ad4m
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/ad4m-pairing.mjs
          sparse-checkout-cone-mode: false
      - name: Check the description for a pairing
        env:
          # Through the environment, never interpolated into the script: the description is written
          # by whoever opened the pull request.
          EVENT_BODY: ${{ github.event.pull_request.body }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BRANCH: ${{ github.ref_name }}
        run: |
          # Dispatched, there is no PR in the event: the PR is the one open from this branch. With
          # none there is nothing that could merge, so nothing to stop.
          if [ -z "$PR_NUMBER" ]; then
            PR_NUMBER="$(gh api "repos/$REPO/pulls?head=${REPO%%/*}:$BRANCH&state=open" --jq '.[0].number // empty')"
            if [ -z "$PR_NUMBER" ]; then
              echo "No open PR from $BRANCH, so no description to read."
              exit 0
            fi
            echo "Reading the description of #$PR_NUMBER, the open PR from $BRANCH."
          fi

          # The description as it is now: a re-run replays its event, description included, so the
          # event's copy would still hold a block somebody has since removed. That copy is only a
          # fallback on a PR event; a dispatch has none, and an empty description would read as
          # unpaired and pass, so there a failed read fails the check.
          if ! PR_BODY="$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq '.body // ""')"; then
            if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
              echo "::error::Could not read the description of #$PR_NUMBER, so cannot tell whether it is paired."
              exit 1
            fi
            PR_BODY="$EVENT_BODY"
          fi

          if printf '%s' "$PR_BODY" | node scripts/ad4m-pairing.mjs --require-unpaired 2>why.txt; then
            exit 0
          fi
          PAIRING="$(printf '%s' "$PR_BODY" | node scripts/ad4m-pairing.mjs 2>/dev/null | sed -n 's/^pairing=//p')"
          echo "::error title=Paired with ${PAIRING:-an ad4m change}::Remove the pairing block from the description once the pin has the change. The step summary says how."
          {
            echo '### Not ready to merge: this PR is paired with ad4m'
            echo
            echo '```'
            cat why.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cat why.txt
          exit 1
