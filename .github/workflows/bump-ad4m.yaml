name: Bump ad4m

# Keeps one open pull request that moves WE's ad4m pin to the snapshot of ad4m `dev`'s head
# (docs/contributing/ad4m-and-deploys.md, "Keeping the pin current").
#
# Every run starts from `dev`, runs `pnpm bump:ad4m dev`, and force-pushes the result to one branch,
# so there is at most one bump PR at a time and it always names the newest commit. Merging it ends
# that PR; the next run after ad4m `dev` moves opens a new one. When the pin is already current, or
# the snapshot is not published yet, the run does nothing.
#
# Once a day rather than on every ad4m push: until ad4m publishes executor binaries, each new commit
# costs an executor build, and each bump is a lockfile change that conflicts with every open PR that
# also moves the pin. Run it by hand for a bump sooner.
#
# A PR opened with GITHUB_TOKEN starts no workflows of its own, so this starts CI on the branch
# itself, and the results appear as checks on the PR. The Netlify preview needs nothing: Netlify
# hears about the PR from GitHub whoever opened it. Before any of that it starts the new commit's
# executor building on `dev` (`ad4m-executor.yaml`), so it is cached once, where every PR reads it.
#
# Opening a PR needs the repository setting "Allow GitHub Actions to create and approve pull
# requests" (Settings → Actions → General).
#
# Every hour, the `ready` job tells a PR pinning an ad4m pull request's snapshot when that pull
# request has merged, or when it has commits the PR does not pin yet: nothing in this repository
# runs when either happens, so asking is how it finds out.
on:
  schedule:
    - cron: '47 5 * * *' # the bump
    - cron: '17 * * * *' # the ready job
  workflow_dispatch:

permissions:
  contents: write # push the bump branch
  pull-requests: write # open and update the PR
  actions: write # start CI on the bump branch
  issues: write # comment on PRs whose pinned ad4m change has merged (the `ready` job)

concurrency:
  group: bump-ad4m
  cancel-in-progress: false

env:
  BRANCH: bot/bump-ad4m

jobs:
  bump:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '47 5 * * *'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: dev

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - uses: pnpm/action-setup@v6

      - name: Bump
        id: bump
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node scripts/bump-ad4m.mjs dev --if-newer --lockfile-only --pr-body "$RUNNER_TEMP/body.md"
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "commit=$(node scripts/ad4m-pin.mjs --commit)" >> "$GITHUB_OUTPUT"
          fi

      # The branch already holding this commit means the PR is up to date: pushing it again would
      # only start CI for nothing.
      - name: Check the open bump
        id: current
        if: steps.bump.outputs.changed == 'true'
        env:
          COMMIT: ${{ steps.bump.outputs.commit }}
        run: |
          PINNED=''
          if git fetch -q --depth 1 origin "$BRANCH" 2>/dev/null; then
            PINNED="$(git show FETCH_HEAD:package.json | node scripts/ad4m-pin.mjs --from - | sed -n 's/^commit=//p')" || PINNED=''
          fi
          if [ "$PINNED" = "$COMMIT" ]; then
            echo "$BRANCH is already on $COMMIT"
            echo "stale=false" >> "$GITHUB_OUTPUT"
          else
            echo "stale=true" >> "$GITHUB_OUTPUT"
          fi

      # Before anything starts CI on the branch: the fetch takes the commit's concurrency group first,
      # so the bump PR's own run waits for it and restores rather than building a copy only that PR
      # can read — and the push to `dev` after the bump merges finds it already cached. See
      # `ad4m-executor.yaml`.
      # Usually a download of the executor ad4m's CI built, in seconds; a build only where it
      # published none.
      - name: Fetch the new executor on dev
        if: steps.current.outputs.stale == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.bump.outputs.commit }}
        run: |
          # Only saves time, so it never stops the bump: without it, the first run that needs the
          # executor builds it, as before.
          if ! gh workflow run ad4m-executor.yaml --ref dev -f commit="$SHA"; then
            echo "::warning::Could not start the executor build on dev; the first run that needs it builds it."
          fi

      - name: Push the branch
        if: steps.current.outputs.stale == 'true'
        env:
          COMMIT: ${{ steps.bump.outputs.commit }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B "$BRANCH"
          git commit -qam "chore(deps): bump ad4m to ${COMMIT:0:9}"
          git push -f origin "$BRANCH"

      - name: Open or update the PR
        if: steps.current.outputs.stale == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ steps.bump.outputs.commit }}
        run: |
          {
            cat "$RUNNER_TEMP/body.md"
            echo
            echo "---"
            echo
            echo "Opened by the [Bump ad4m]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/workflows/bump-ad4m.yaml) workflow, which updates this PR once a day while ad4m \`dev\` has moved. CI runs on each update."
          } > "$RUNNER_TEMP/pr.md"
          TITLE="chore(deps): bump ad4m to ${COMMIT:0:9}"

          NUMBER="$(gh api "repos/$GITHUB_REPOSITORY/pulls?head=${GITHUB_REPOSITORY_OWNER}:$BRANCH&state=open" -q '.[0].number // empty')"
          if [ -n "$NUMBER" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/pulls/$NUMBER" -f title="$TITLE" -F body=@"$RUNNER_TEMP/pr.md" -q .html_url
          elif ! gh api -X POST "repos/$GITHUB_REPOSITORY/pulls" -f title="$TITLE" -f head="$BRANCH" -f base=dev \
              -F body=@"$RUNNER_TEMP/pr.md" -q .html_url; then
            echo "::error::Could not open the PR. Turn on \"Allow GitHub Actions to create and approve pull requests\" in Settings → Actions → General. The branch $BRANCH is pushed, so the PR can also be opened by hand."
            exit 1
          fi

      - name: Start CI on the branch
        if: steps.current.outputs.stale == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        # And the live tests, which are the point of a bump: they run against an executor built from
        # the commit the PR moves to. And the pin gate, whose check is required like CI's: one that
        # never reports would block the PR for good.
        run: |
          gh workflow run build.yaml --ref "$BRANCH"
          gh workflow run ad4m-live.yaml --ref "$BRANCH"
          gh workflow run pr-tasks.yaml --ref "$BRANCH"

  # A PR pinning an ad4m pull request's snapshot hears when that pull request merges — its gate is
  # re-run when it now passes, and it gets a comment naming the command when the pin needs moving —
  # and, while it is open, when it has moved past the pinned commit.
  # Independent of the bump above. scripts/ad4m-repin.mjs has the rules.
  ready:
    name: Tell PRs their ad4m change has merged
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '17 * * * *'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: dev
          sparse-checkout: scripts
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Check PRs pinning an ad4m snapshot
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ad4m-repin.mjs
