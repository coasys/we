# Packages the Electron desktop app, and publishes it as a GitHub release when a version is tagged.
#
# Separate from the CI workflow (build.yaml) because packaging needs the AD4M executor
# binary, which means checking out a second repository and compiling ~2000 Rust crates.
# CI should stay fast and focused on the code under test; packaging is a release concern.
#
# The executor is cached by AD4M commit, so that compile only happens when AD4M has moved.
# A run that compiles it takes about 45 minutes on Linux and two and a half hours on macOS;
# one that restores it skips straight to building and packaging WE.
#
# Produces unsigned artifacts. Code signing (Apple Developer ID, notarisation) is a
# follow-up — the certificates are not yet configured as repository secrets.
name: Electron Package

# Runs when a release is tagged (`v0.1.0-alpha.1`, pushed after `dev` is merged into `main`), and by
# hand from the Actions tab for any branch. Not on every merge to `dev`: a run that compiles the
# executor takes hours on macOS, and what reaches people is a release, not a merge.
#
# macOS is off unless a manual run asks for it. The executor cannot currently be compiled there:
# `ort-sys` downloads a prebuilt ONNX Runtime that its host has withdrawn for every macOS target.
# Turn it back on for tagged runs once that is fixed in AD4M.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      ad4m_ref:
        description: AD4M branch, tag or commit to build the executor from. Empty means the commit the pinned @coasys/ad4m was published from.
        default: ''
      mac:
        description: Also package for macOS
        type: boolean
        default: false

# A newer run on the same ref waits rather than cancelling the one in flight. Cancelling a macOS
# run that is compiling the executor would mean it never finishes — and so never fills the cache
# that makes later runs fast.
concurrency:
  group: electron-package-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.mac && '[{"os":"ubuntu-latest","platform":"linux"},{"os":"macos-latest","platform":"mac"}]' || '[{"os":"ubuntu-latest","platform":"linux"}]') }}

    runs-on: ${{ matrix.os }}
    # Room for a cold macOS run, while stopping a hung one well short of GitHub's six hours.
    timeout-minutes: 240

    steps:
      # ── Source ──────────────────────────────────────────────────────────

      - name: Check out WE
        uses: actions/checkout@v7

      # A tag names a version, and the app says which version it is from package.json. A tag that
      # disagrees would publish a release whose files are named after something else.
      - name: Check the tag matches the version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $VERSION. Bump the version on dev, merge dev into main, and tag v<version>."
            exit 1
          fi

      # ── WE toolchain (Node + pnpm) ────────────────────────────────────

      - uses: ./.github/actions/setup

      # ── AD4M executor ──────────────────────────────────────────────────
      #
      # From the commit the pinned @coasys/ad4m was published from, or the ref a manual run names:
      # restored when cached, built and cached when not. The same action, key and path as the live
      # tests (`ad4m-live.yaml`), so the app ships the binary those tests ran against and either
      # workflow's build serves the other. It lands at `../ad4m/target/release/ad4m-executor`, where
      # `we-seed.json`'s `executorPath` finds it.
      - name: AD4M executor
        uses: ./.github/actions/ad4m-executor
        with:
          ref: ${{ inputs.ad4m_ref }}
          v8-from-source: ${{ matrix.platform == 'mac' }}

      # libfuse2 for the AppImage. The executor's build dependencies are the action's.
      - name: Install system dependencies (Linux)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2

      # ── Build WE ──────────────────────────────────────────────────────

      - name: Build WE packages
        run: NODE_OPTIONS='--max-old-space-size=8192' pnpm build

      # ── Package ────────────────────────────────────────────────────────
      #
      # `electron:build` runs vite build + electron-builder.
      # `generate-seed-config.cjs` runs as a `preelectron:build` script
      # and resolves the executor path into `seed-extra-resources.json`,
      # which electron-builder reads to copy the binary into the package.

      - name: Package Electron app
        run: pnpm electron:build
        working-directory: apps/we-electron

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: WE-electron-${{ matrix.platform }}
          path: |
            apps/we-electron/dist-electron/*.AppImage
            apps/we-electron/dist-electron/*.dmg
            apps/we-electron/dist-electron/*.zip
          if-no-files-found: error
          retention-days: 14

  # Publishes what the package job built as the release for the tag. Only on a tag: a manual run
  # leaves its files as workflow artifacts and publishes nothing.
  release:
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out WE
        uses: actions/checkout@v7

      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          path: release-files
          merge-multiple: true

      # The notes say which ad4m the release was built against, since the executor inside it is
      # the one thing a user cannot swap out. A pre-release version (`-alpha.1`) is published as a
      # pre-release, so it never shows as the latest release.
      #
      # GitHub's generated list of merged PRs is added from the second release on. For the first
      # it would list every PR the repository has ever merged.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PIN="$(node -p "require('./package.json').pnpm.overrides['@coasys/ad4m']")"
          AD4M_SHA="$(cd "$RUNNER_TEMP" && npm view "@coasys/ad4m@$PIN" gitHead)"

          cp .github/release-notes.md notes.md
          printf '\n### Built with\n\n@coasys/ad4m `%s`, and the ad4m executor from [`%s`](https://github.com/coasys/ad4m/commit/%s).\n' \
            "$PIN" "${AD4M_SHA:0:9}" "$AD4M_SHA" >> notes.md

          FLAGS=()
          case "$VERSION" in *-*) FLAGS+=(--prerelease) ;; esac
          if [ -n "$(gh release list --limit 1)" ]; then FLAGS+=(--generate-notes); fi

          gh release create "$GITHUB_REF_NAME" release-files/* \
            --verify-tag \
            --title "WE $VERSION" \
            --notes-file notes.md \
            "${FLAGS[@]}"
