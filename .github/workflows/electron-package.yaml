# Packages the Electron desktop app for Linux and macOS.
#
# Separate from the CI workflow (build.yaml) because packaging needs the AD4M executor
# binary, which means checking out a second repository and compiling ~2000 Rust crates.
# CI should stay fast and focused on the code under test; packaging is a release concern.
#
# Produces unsigned artifacts. Code signing (Apple Developer ID, notarisation) is a
# follow-up — the certificates are not yet configured as repository secrets.
name: Electron Package

on:
  push:
    branches: [dev]
  pull_request:
    paths:
      - 'apps/we-electron/**'
      - 'we-seed.json'
      - '.github/workflows/electron-package.yaml'
  workflow_dispatch:

concurrency:
  group: electron-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: mac

    runs-on: ${{ matrix.os }}

    steps:
      # ── Source ──────────────────────────────────────────────────────────

      - name: Check out WE
        uses: actions/checkout@v7

      # AD4M checked out as a sibling so `we-seed.json`'s relative
      # `"executorPath": "../ad4m/target/release/ad4m-executor"` resolves
      # without any path rewriting.
      #
      # Manual clone rather than `actions/checkout` with `path: ../ad4m`:
      # the checkout action documents `path` as "under $GITHUB_WORKSPACE",
      # and going above it with `../` works in practice but is not
      # guaranteed across runner versions. A shallow clone is faster anyway.
      - name: Check out AD4M
        run: git clone --depth 1 --branch dev https://github.com/coasys/ad4m.git "${GITHUB_WORKSPACE}/../ad4m"

      # ── WE toolchain (Node + pnpm) ────────────────────────────────────

      - uses: ./.github/actions/setup

      # ── AD4M executor toolchain ────────────────────────────────────────
      #
      # The executor embeds a Deno runtime, a Holochain conductor, and a
      # V8 isolate. Building it needs Rust, cmake (for openssl), and on
      # macOS a V8 source build (the coasys/rusty_v8 fork does not publish
      # prebuilt simdutf binaries for aarch64-apple-darwin).

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.86.0'

      - name: Cache Cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-registry-${{ matrix.platform }}
          restore-keys: cargo-registry-${{ matrix.platform }}

      # Linux: alsa-sys needs libasound2-dev; AppImage needs libfuse2.
      - name: Install system dependencies (Linux)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake protobuf-compiler libasound2-dev libfuse2

      # macOS: ninja is needed for V8 source build.
      - name: Install system dependencies (macOS)
        if: matrix.platform == 'mac'
        run: brew install cmake protobuf ninja

      - name: Install Python (macOS)
        if: matrix.platform == 'mac'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ── Build AD4M executor ────────────────────────────────────────────
      #
      # Two stages: snapshot, then the executor binary.
      #
      # 1. The Deno V8 snapshot (`CUSTOM_DENO_SNAPSHOT.bin` +
      #    `CUSTOM_DENO_SNAPSHOT.residual_esm.rs`) is gitignored and must
      #    be generated before the executor compiles — the lib crate
      #    `include_bytes!` them. The generator is a separate binary in the
      #    `rust-executor` package, gated behind the `generate_snapshot`
      #    feature.
      #
      # 2. The executor itself. `-p ad4m --bin ad4m-executor` builds only
      #    the cli crate and its transitive deps — not the Tauri launcher,
      #    not the language modules, not the full SDK.
      #
      # V8_FROM_SOURCE on macOS: the coasys/rusty_v8 fork's v150.4.0
      # release only has simdutf prebuilt binaries for x86_64-linux.
      # macOS aarch64 gets a 404, so V8 must build from source there.
      # This adds significant time but is the only path that works
      # until the fork publishes aarch64-apple-darwin simdutf artifacts.

      # Retry wrapper: AD4M's build.rs downloads alliance.dna with bare
      # curl (no --retry). A transient GitHub 504 kills a 40-minute build.
      # Retrying the cargo command itself is safe — build.rs skips the
      # download when the file already exists in OUT_DIR.
      - name: Generate Deno snapshot
        working-directory: ${{ github.workspace }}/../ad4m/rust-executor
        env:
          V8_FROM_SOURCE: ${{ matrix.platform == 'mac' && '1' || '' }}
        run: |
          for attempt in 1 2 3; do
            echo "::group::Attempt $attempt"
            if cargo run --release --features generate_snapshot --bin generate_snapshot; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            echo "⚠️ Attempt $attempt failed"
            [ "$attempt" -lt 3 ] && sleep 15
          done
          echo "::error::Snapshot generation failed after 3 attempts"
          exit 1

      - name: Build AD4M executor
        working-directory: ${{ github.workspace }}/../ad4m
        env:
          V8_FROM_SOURCE: ${{ matrix.platform == 'mac' && '1' || '' }}
        run: |
          for attempt in 1 2 3; do
            echo "::group::Attempt $attempt"
            if cargo build --release -p ad4m --bin ad4m-executor; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            echo "⚠️ Attempt $attempt failed"
            [ "$attempt" -lt 3 ] && sleep 15
          done
          echo "::error::Executor build failed after 3 attempts"
          exit 1

      # ── Build WE ──────────────────────────────────────────────────────

      - name: Build WE packages
        run: NODE_OPTIONS='--max-old-space-size=8192' pnpm build

      # ── Package ────────────────────────────────────────────────────────
      #
      # `electron:build` runs vite build + electron-builder.
      # `generate-seed-config.cjs` runs as a `preelectron:build` script
      # and resolves the executor path into `seed-extra-resources.json`,
      # which electron-builder reads to copy the binary into the package.

      - name: Package Electron app
        run: pnpm electron:build
        working-directory: apps/we-electron

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: WE-electron-${{ matrix.platform }}
          path: |
            apps/we-electron/dist-electron/*.AppImage
            apps/we-electron/dist-electron/*.dmg
            apps/we-electron/dist-electron/*.zip
          retention-days: 14
