name: Build

on:
  push:
    branches: [dev]
  pull_request:

# One run per branch/PR — a second push cancels the in-flight run instead of
# duplicating the full AD4M source build.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # WE's .nvmrc pins Node 24 (uses Node 22+ features like `fs.globSync`).
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # WE runs under the pnpm major developers actually use (packageManager:
      # pnpm@10.18.3).  ad4m's monorepo uses object-format pnpm.overrides which
      # pnpm v10 rejects, so its install (below) is invoked via `npx pnpm@9`
      # without touching the global binary.
      - name: Install pnpm
        run: npm install -g pnpm@10.18.3

      - name: Detect branch
        id: branch
        run: |
          BRANCH="${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}"
          echo "name=$BRANCH" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --heads \
            https://github.com/coasys/ad4m.git "$BRANCH" >/dev/null 2>&1; then
            echo "ad4m_branch=$BRANCH" >> "$GITHUB_OUTPUT"
            echo "✅ Found matching AD4M branch: $BRANCH"
          else
            echo "ad4m_branch=dev" >> "$GITHUB_OUTPUT"
            echo "ℹ️ No matching AD4M branch — using dev"
          fi

      # --- AD4M linked build (published packages have broken workspace: refs) ---

      - name: Clone AD4M
        run: |
          git clone --depth 1 --single-branch \
            --branch "${{ steps.branch.outputs.ad4m_branch }}" \
            https://github.com/coasys/ad4m.git ad4m

      - name: Get AD4M commit hash
        id: ad4m-hash
        run: |
          HASH=$(cd ad4m && git rev-parse HEAD)
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"
          echo "AD4M commit: $HASH"

      - name: Cache AD4M built outputs
        id: ad4m-cache
        uses: actions/cache@v4
        with:
          path: |
            ad4m/node_modules
            ad4m/core/lib
            ad4m/connect/dist
          key: ad4m-sdk-${{ steps.ad4m-hash.outputs.hash }}

      - name: Install & build AD4M packages
        if: steps.ad4m-cache.outputs.cache-hit != 'true'
        run: |
          cd ad4m
          npx -y pnpm@9.15.0 install --no-frozen-lockfile

          cd core && npx -y pnpm@9.15.0 exec tsc && npx -y pnpm@9.15.0 run bundle && cd ..
          cd connect && npx -y pnpm@9.15.0 run build && cd ..

      # --- WE build ---

      # Cache the pnpm content-addressable store, not node_modules: the
      # workspace nests packages 2–4 levels deep, so a node_modules glob
      # misses most of it, and pnpm's own guidance is to cache the store.
      - name: Get pnpm store directory
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-

      # Gate lockfile drift while package.json is still pristine — the AD4M
      # override rewrite below necessarily diverges from the lockfile, so this
      # is the only point where --frozen-lockfile can be meaningful.
      - name: Check lockfile is in sync
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Override AD4M packages with local builds
        run: |
          node -e "
            const pkg = require('./package.json');
            pkg.pnpm = pkg.pnpm || {};
            pkg.pnpm.overrides = pkg.pnpm.overrides || {};
            pkg.pnpm.overrides['@coasys/ad4m'] = 'file:./ad4m/core';
            pkg.pnpm.overrides['@coasys/ad4m-connect'] = 'file:./ad4m/connect';
            require('fs').writeFileSync('./package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

      # --no-frozen-lockfile is required here (the file: overrides above are
      # deliberate lockfile drift); sync with the committed manifests was
      # already verified by the frozen install before the rewrite.
      - name: Install WE dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Clear build caches for linked SDK
        run: |
          rm -rf .turbo node_modules/.cache
          find . -name '.turbo' -type d -not -path './ad4m/*' -not -path './node_modules/*' -exec rm -rf {} + 2>/dev/null || true
          find . -name '.vite' -type d -path '*/node_modules/.vite' -not -path './ad4m/*' -exec rm -rf {} + 2>/dev/null || true

      - name: Lint
        run: NODE_OPTIONS='--max-old-space-size=8192' pnpm lint

      # Stylelint was configured (config, deps, editor integration) but never
      # ran anywhere but editors — now it gates the authored CSS.
      - name: Lint CSS
        run: pnpm lint:css

      - name: Build
        run: NODE_OPTIONS='--max-old-space-size=8192' pnpm build

      # `pnpm build` regenerates the AI-context outputs (CLAUDE.md et al.) and
      # the core manifest.  If a PR changed their inputs without committing the
      # regenerated files, fail here rather than drifting silently.
      # Whole-tree rather than a hand-listed set of paths. The list named seven files and the build
      # regenerates seventeen — `prebuild:steps` also writes ten tracked Tauri files — so editing
      # `we-seed.json` without committing the regenerated output passed green. A path list is also
      # blind to files the build *creates*, and it rots every time a generator is added.
      #
      # `--porcelain` covers modified, deleted and untracked in one check, and cannot go out of date.
      - name: Check generated files are committed
        run: |
          # Three exclusions, all of them things *this workflow* put there: `package.json` and the
          # lockfile are rewritten a few steps up to point the AD4M overrides at the locally built
          # copies, and `ad4m/` is the source clone itself, which is untracked by design. Everything
          # else in the tree is fair game — which is the point, and why this cannot go stale the way
          # the old list did.
          EXCLUDES=(':(exclude)package.json' ':(exclude)pnpm-lock.yaml' ':(exclude)ad4m')
          DRIFT="$(git status --porcelain -- . "${EXCLUDES[@]}")"
          if [ -n "$DRIFT" ]; then
            echo '::error::The build changed tracked files — run `pnpm build` and commit the regenerated output.'
            echo "$DRIFT"
            # Same exclusions as the check — otherwise the diff prints the workflow's own
            # package.json/lockfile rewrite underneath the real finding and reads as the cause.
            git diff --stat -- . "${EXCLUDES[@]}"
            exit 1
          fi

      # 12.6k LOC of template data that `tsc` cannot judge: an unknown component
      # type, a misspelled prop, a `$routes` outlet with no `routes` array and an
      # orphan `$local` all typecheck cleanly and then render nothing.  The
      # validator has always existed and been thorough — it was reachable only
      # from the AI editor and the CLI, so nothing ran it on the way in.
      - name: Validate schemas
        run: pnpm validate:schemas

      # Runs after Build so every package's dist types exist.  Only packages
      # that define a `typecheck` script participate; coverage is being grown
      # package by package.
      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test
