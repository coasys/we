name: Build

on:
  push:
    branches: [dev]
  pull_request:

# One run per branch/PR — a second push cancels the in-flight run instead of
# duplicating the work.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # WE's .nvmrc pins Node 24 (uses Node 22+ features like `fs.globSync`).
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # Matches the repo's `packageManager` field, so CI resolves dependencies
      # exactly as a developer's machine does.
      - name: Install pnpm
        run: npm install -g pnpm@10.18.3

      # Cache the pnpm content-addressable store, not node_modules: the
      # workspace nests packages 2–4 levels deep, so a node_modules glob
      # misses most of it, and pnpm's own guidance is to cache the store.
      - name: Get pnpm store directory
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-

      # Frozen, and nothing rewrites it afterwards.
      #
      # This job used to clone the AD4M repo, build its SDK from source, and point
      # `pnpm.overrides` at the result — so it validated WE against whatever AD4M's
      # `dev` branch happened to hold at the moment the job ran, rather than against
      # the version this repo pins. Three things followed from that: the same WE
      # commit could go from green to red with no WE change (and did — `dev` sat red
      # for two days while every developer's machine built cleanly); a green build
      # said nothing about the combination anyone actually runs or would ship; and
      # the failure surfaced as a TypeScript error inside WE's own source, naming
      # nothing that would lead a reader to the real cause.
      #
      # The justification for it — that the published packages carry broken
      # `workspace:` refs — does not hold: `@coasys/ad4m` publishes none at all, and
      # `@coasys/ad4m-connect`'s single one is in `devDependencies`, which a consumer
      # never installs.
      #
      # Testing WE against unreleased AD4M is still worth doing; it just cannot be
      # the gate that decides whether a WE change may merge. It lives in
      # `ad4m-compat.yaml`, on a schedule and on demand.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: NODE_OPTIONS='--max-old-space-size=8192' pnpm lint

      # Stylelint was configured (config, deps, editor integration) but never
      # ran anywhere but editors — now it gates the authored CSS.
      - name: Lint CSS
        run: pnpm lint:css

      - name: Build
        run: NODE_OPTIONS='--max-old-space-size=8192' pnpm build

      # `pnpm build` regenerates the AI-context outputs (CLAUDE.md et al.) and
      # the core manifest.  If a PR changed their inputs without committing the
      # regenerated files, fail here rather than drifting silently.
      # Whole-tree rather than a hand-listed set of paths. The list named seven files and the build
      # regenerates seventeen — `prebuild:steps` also writes ten tracked Tauri files — so editing
      # `we-seed.json` without committing the regenerated output passed green. A path list is also
      # blind to files the build *creates*, and it rots every time a generator is added.
      #
      # `--porcelain` covers modified, deleted and untracked in one check, and cannot go out of date.
      - name: Check generated files are committed
        run: |
          # No exclusions. This check used to exempt `package.json`, `pnpm-lock.yaml` and `ad4m/`,
          # all three of which were things the workflow itself had put there — it rewrote the
          # manifest and lockfile to point at a local SDK build, then had to agree not to notice.
          # Nothing rewrites them now, so the check covers the whole tree, and a build that touches
          # the manifest or the lockfile is a finding rather than an exemption.
          DRIFT="$(git status --porcelain)"
          if [ -n "$DRIFT" ]; then
            echo '::error::The build changed tracked files — run `pnpm build` and commit the regenerated output.'
            echo "$DRIFT"
            git diff --stat
            exit 1
          fi

      # 12.6k LOC of template data that `tsc` cannot judge: an unknown component
      # type, a misspelled prop, a `$routes` outlet with no `routes` array and an
      # orphan `$local` all typecheck cleanly and then render nothing.  The
      # validator has always existed and been thorough — it was reachable only
      # from the AI editor and the CLI, so nothing ran it on the way in.
      - name: Validate schemas
        run: pnpm validate:schemas

      # Runs after Build so every package's dist types exist.  Only packages
      # that define a `typecheck` script participate; coverage is being grown
      # package by package.
      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test
