name: AD4M compatibility

# Does WE still build, typecheck and test against an AD4M change that is not published yet?
#
# The required build (`build.yaml`) installs the AD4M version this repo pins. A paired deploy
# preview (an `ad4m:` line in a PR description) builds WE against an AD4M change, but only builds
# it. This job answers the remaining question: WE compiled against an AD4M change's *source*, with
# its typecheck and tests, before that change is published. It runs two ways:
#
# - **On a paired pull request**, automatically. It reads the `ad4m:` line and tests the pull
#   request's own commit against what it names. This is the check that says whether a paired
#   change works, while the required jobs are red waiting for the pin to move — without it, a
#   paired pull request went days with Typecheck, Test and schemas never running at all, and a
#   real regression could hide behind the failure everyone expected. Unpaired pull requests skip
#   it. Editing the line does not re-run it, as with the preview: push again, or re-run the run.
# - **From the Actions tab**, naming an AD4M branch, against the last WE commit that passed CI.
#
# It used to run nightly against AD4M `dev` and keep a tracking issue. Now every merge to AD4M
# `dev` is published and the bump workflow (`bump-ad4m.yaml`) opens a PR for it within the hour,
# with CI and a preview, which answers the same question sooner and where the fix goes. See
# docs/contributing/ad4m-and-deploys.md.
#
# What it deliberately is not is a gate. It compiles against a branch, so its result depends
# on when it runs and on what someone else pushed to another repository; a WE pull request
# must not be blocked, or unblocked, by that.
#
#
# ## Why it tests the last *green* WE commit rather than `dev` HEAD
#
# A failure here has two candidate causes — AD4M drifted, or WE's own `dev` is broken — and
# for its first four days this job could not tell them apart. Of its three failures, one was
# real (`Property 'identity' does not exist on type 'SHACLPropertyShape'`, a genuine
# divergence: the property exists in the pinned `0.13.0-test-interpretation-2` and had not
# landed on AD4M `dev`). The other two were the same broken `graph-core` test files that the
# required build had already reported on `dev` — WE's own breakage, re-reported for two days
# under a name that claims it is about AD4M.
#
# The fix is a control, not better wording. The most recent *successful* Build run on `dev`
# has already proved its commit compiles against pinned AD4M. Testing that commit leaves
# AD4M as the only variable, so a failure is attributable by construction rather than by a
# human reading the log and knowing the codebase. It also means a long-red `dev` no longer
# blinds this job — it keeps answering about the last thing that worked.

on:
  pull_request:
  workflow_dispatch:
    inputs:
      ad4m_branch:
        description: 'AD4M branch to build WE against'
        required: false
        default: 'dev'
      we_ref:
        description: 'WE ref to test (default: the last commit that passed CI on dev)'
        required: false

# `actions: read` to find the last green Build run and the previous run of this workflow.
permissions:
  contents: read
  actions: read

# One run per pull request, or per AD4M branch from the Actions tab.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.event.inputs.ad4m_branch || 'dev' }}
  cancel-in-progress: true

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  # Which AD4M to build against, and whether there is anything to do at all.
  #
  # A job of its own so the job below can be skipped outright on an unpaired pull request: a
  # job-level `if` needs the answer before that job starts. It has to run on every pull request to
  # find out — the PR template shows the line as an example inside a comment, so no filter on the
  # raw description can tell a paired one apart.
  resolve:
    name: Read the ad4m pairing
    runs-on: ubuntu-latest
    outputs:
      pairing: ${{ steps.resolve.outputs.pairing }}
      ref: ${{ steps.resolve.outputs.ref }}
    steps:
      # Only the parser. Nothing here is built or installed.
      - uses: actions/checkout@v7
        if: github.event_name == 'pull_request'
        with:
          sparse-checkout: scripts/ad4m-pairing.mjs
          sparse-checkout-cone-mode: false

      # Inputs and the description reach the shell as environment variables rather than being
      # interpolated into the script text, so they are always data and never something that can
      # end up parsed as part of the command. The parser refuses a ref that is not a plain name.
      - name: Resolve
        id: resolve
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          REQUESTED_BRANCH: ${{ github.event.inputs.ad4m_branch }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = 'pull_request' ]; then
            # Paired → pairing, ref and reason; unpaired → nothing, and the job below is skipped.
            # A line that cannot be read, or names a pull request that cannot be found, fails here
            # with the reason, as the preview does.
            printf '%s' "$PR_BODY" | node scripts/ad4m-pairing.mjs --resolve | tee -a "$GITHUB_OUTPUT"
            exit "${PIPESTATUS[1]}"
          fi

          BRANCH="${REQUESTED_BRANCH:-dev}"
          if ! git ls-remote --exit-code --heads \
            https://github.com/coasys/ad4m.git "$BRANCH" >/dev/null 2>&1; then
            echo "::error::No such AD4M branch: $BRANCH"
            exit 1
          fi
          {
            echo "pairing=coasys/ad4m@$BRANCH"
            echo "ref=$BRANCH"
            echo "reason=requested from the Actions tab"
          } >> "$GITHUB_OUTPUT"

  compat:
    needs: resolve
    if: needs.resolve.outputs.ref != ''
    # A fixed name, not one built from the pairing: GitHub shows a SKIPPED job's name unevaluated,
    # so on every unpaired pull request the check list would read `Against ${{ … }}`. Which change
    # it ran against is the first line of the run's summary, and the required checks' warning
    # names it too.
    name: Against the paired ad4m
    runs-on: ubuntu-latest
    steps:
      # ---------------------------------------------------------------- resolve what to test

      # The control. A green Build run on `dev` means that commit compiles, typechecks and
      # tests against the AD4M this repo pins — so if it fails below, AD4M is the difference.
      #
      # `controlled=false` records the two cases where that guarantee does not hold: an
      # explicitly requested ref, and the case where no green run could be found at all. The
      # report says so rather than claiming an attribution it has not earned.
      #
      # A pull request is tested at its own commit, which is the question there: does THIS
      # change work against the AD4M change it pairs with. `mode=pr` also turns on the checks
      # the required jobs skip while Build is red.
      - name: Resolve WE ref
        id: we-ref
        env:
          REQUESTED: ${{ github.event.inputs.we_ref }}
        run: |
          if [ "${{ github.event_name }}" = 'pull_request' ]; then
            echo "ref=${{ github.sha }}"  >> "$GITHUB_OUTPUT"
            echo "controlled=false"       >> "$GITHUB_OUTPUT"
            echo "why=this pull request"  >> "$GITHUB_OUTPUT"
            echo "mode=pr"                >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "mode=dispatch" >> "$GITHUB_OUTPUT"

          if [ -n "$REQUESTED" ]; then
            echo "ref=$REQUESTED"        >> "$GITHUB_OUTPUT"
            echo "controlled=false"      >> "$GITHUB_OUTPUT"
            echo "why=explicitly requested" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          SHA="$(gh api \
            "repos/${{ github.repository }}/actions/workflows/build.yaml/runs?branch=dev&status=success&per_page=1" \
            --jq '.workflow_runs[0].head_sha // empty')"

          if [ -n "$SHA" ]; then
            echo "ref=$SHA"          >> "$GITHUB_OUTPUT"
            echo "controlled=true"   >> "$GITHUB_OUTPUT"
            echo "why=last commit green on dev" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No successful Build run found on dev — falling back to HEAD. A failure below will not be attributable."
            echo "ref=dev"           >> "$GITHUB_OUTPUT"
            echo "controlled=false"  >> "$GITHUB_OUTPUT"
            echo "why=no green Build run found on dev" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.we-ref.outputs.ref }}

      # Setup is inlined rather than using .github/actions/setup, which the required build
      # shares. A local composite action is resolved from the *checked-out working tree*, and
      # this job checks out an older commit on purpose — one that predates that file, or in
      # the `we_ref` case may never contain it. Inline steps come from the workflow itself and
      # so are always present.
      #
      # The install is separate and comes later: the override rewrite below is deliberate
      # lockfile drift, so it cannot be frozen.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - uses: pnpm/action-setup@v6

      - name: Get pnpm store directory
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-

      # ---------------------------------------------------------------- build the AD4M SDK

      # A fetch of one ref rather than `git clone --branch`, which cannot take a commit or a pull
      # request ref — and a paired pull request names `pull/N/head`, or a merge commit once merged.
      - name: Fetch AD4M
        env:
          AD4M_REF: ${{ needs.resolve.outputs.ref }}
        run: |
          git init -q ad4m
          git -C ad4m fetch -q --depth 1 https://github.com/coasys/ad4m.git "$AD4M_REF"
          git -C ad4m checkout -q FETCH_HEAD

      - name: Get AD4M commit hash
        id: ad4m-hash
        run: echo "hash=$(cd ad4m && git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Cache AD4M built outputs
        id: ad4m-cache
        uses: actions/cache@v6
        with:
          path: |
            ad4m/node_modules
            ad4m/core/lib
            ad4m/connect/dist
          key: ad4m-sdk-${{ steps.ad4m-hash.outputs.hash }}

      # ad4m's monorepo uses object-format `pnpm.overrides`, which pnpm v10 rejects — so its
      # install runs via `npx pnpm@9`, leaving the global binary on the version WE uses.
      - name: Install & build AD4M packages
        id: ad4m-build
        if: steps.ad4m-cache.outputs.cache-hit != 'true'
        run: |
          set -o pipefail
          cd ad4m
          npx -y pnpm@9.15.0 install --no-frozen-lockfile 2>&1 | tee -a ../compat.log
          cd core && npx -y pnpm@9.15.0 exec tsc && npx -y pnpm@9.15.0 run bundle && cd ..
          cd connect && npx -y pnpm@9.15.0 run build && cd ..

      # ---------------------------------------------------------------- build WE against it

      # Point the workspace at the source build. This is why the install below cannot be
      # frozen — and why this rewrite lives here rather than in a job whose verdict gates a
      # merge.
      - name: Override AD4M packages with local builds
        run: |
          node -e "
            const pkg = require('./package.json');
            pkg.pnpm = pkg.pnpm || {};
            pkg.pnpm.overrides = pkg.pnpm.overrides || {};
            pkg.pnpm.overrides['@coasys/ad4m'] = 'file:./ad4m/core';
            pkg.pnpm.overrides['@coasys/ad4m-connect'] = 'file:./ad4m/connect';
            require('fs').writeFileSync('./package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

      - name: Install WE dependencies
        id: install
        run: |
          set -o pipefail
          pnpm install --no-frozen-lockfile 2>&1 | tee -a compat.log

      # The linked SDK changes under caches keyed on the previous one.
      - name: Clear build caches for linked SDK
        run: |
          rm -rf node_modules/.cache
          find . -name '.vite' -type d -path '*/node_modules/.vite' -not -path './ad4m/*' -exec rm -rf {} + 2>/dev/null || true

      # Build, typecheck and test only. Lint and the generated-file check answer questions
      # about WE's own source that the required build already answered, and neither can be
      # affected by which AD4M this ran against.
      #
      # Each tees into compat.log so the report can quote the actual error rather than
      # sending a reader to line 2,168 of a 2,500-line log.
      - name: Build
        id: build
        run: |
          set -o pipefail
          NODE_OPTIONS='--max-old-space-size=8192' pnpm build 2>&1 | tee -a compat.log

      - name: Typecheck
        id: typecheck
        run: |
          set -o pipefail
          pnpm typecheck 2>&1 | tee -a compat.log

      - name: Test
        id: test
        run: |
          set -o pipefail
          pnpm test 2>&1 | tee -a compat.log

      # On a pull request, the rest of what the required jobs check after Build. While the pair is
      # waiting on the pin, Build fails there and these never run anywhere else — so a pull request
      # could merge the moment the pin moved having never had its schemas validated.
      #
      # Not from the Actions tab: that tests a commit that already passed all of them against the
      # pin, and none of them can be changed by which AD4M ran.
      - name: Validate schemas and audits
        id: schemas
        if: steps.we-ref.outputs.mode == 'pr'
        run: |
          set -o pipefail
          { pnpm validate:schemas && pnpm audit:roles && pnpm audit:surfaces; } 2>&1 | tee -a compat.log

      - name: Browser tests
        id: browser
        if: steps.we-ref.outputs.mode == 'pr'
        run: |
          set -o pipefail
          pnpm --filter @we/primitives test:browser 2>&1 | tee -a compat.log

      # ---------------------------------------------------------------- report

      # Written on success and on failure alike, to the run's summary page: "green, and here is
      # what it proved" is worth as much as the failure.
      - name: Write report
        id: report
        if: always()
        env:
          AD4M_LABEL: ${{ needs.resolve.outputs.pairing }}
          AD4M_REF: ${{ needs.resolve.outputs.ref }}
          AD4M_HASH: ${{ steps.ad4m-hash.outputs.hash }}
          WE_REF: ${{ steps.we-ref.outputs.ref }}
          CONTROLLED: ${{ steps.we-ref.outputs.controlled }}
          MODE: ${{ steps.we-ref.outputs.mode }}
          WHY: ${{ steps.we-ref.outputs.why }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -u

          # Which stage failed. Read from step outcomes rather than a marker written by the
          # step itself, which is not reliably flushed when the step it is in dies.
          STAGE=''
          for s in 'AD4M SDK build:${{ steps.ad4m-build.outcome }}' \
                   'WE install:${{ steps.install.outcome }}' \
                   'Build:${{ steps.build.outcome }}' \
                   'Typecheck:${{ steps.typecheck.outcome }}' \
                   'Test:${{ steps.test.outcome }}' \
                   'Schemas and audits:${{ steps.schemas.outcome }}' \
                   'Browser tests:${{ steps.browser.outcome }}'; do
            if [ "${s##*:}" = 'failure' ]; then STAGE="${s%%:*}"; break; fi
          done

          {
            if [ -z "$STAGE" ]; then
              echo "## WE builds against $AD4M_LABEL :green_circle:"
              echo
              echo "WE \`${WE_REF:0:12}\` builds, typechecks and tests against AD4M \`${AD4M_HASH:0:12}\`."
              if [ "$MODE" = 'pr' ]; then
                echo
                echo "Schemas, audits and browser tests pass too. Required jobs that fail on this pull request"
                echo "are waiting for the pin to move, not for a fix."
              fi
            else
              echo "## WE does not build against $AD4M_LABEL :red_circle:"
              echo
              echo "| | |"
              echo "|---|---|"
              echo "| WE commit | \`${WE_REF:0:12}\` ($WHY) |"
              echo "| AD4M commit | [\`${AD4M_HASH:0:12}\`](https://github.com/coasys/ad4m/commit/$AD4M_HASH) from \`$AD4M_REF\` |"
              echo "| Failed at | **$STAGE** |"
              echo "| Run | [$RUN_URL]($RUN_URL) |"
              echo

              if [ "$MODE" = 'pr' ]; then
                echo "This is the pull request's own commit, built against the AD4M change it pairs with, so"
                echo "the failure is this pair's to fix — on whichever side the error points at."
              elif [ "$CONTROLLED" = 'true' ]; then
                echo "This commit passes against the AD4M version WE pins — that is what made it"
                echo "eligible to be tested here — so **AD4M is the difference**. Either AD4M needs a"
                echo "fix before the next tag, or WE is using an API that exists only in the pinned"
                echo "version and has not landed upstream."
              else
                echo "> **Not attributable.** The commit tested was $WHY, so it has not been shown to"
                echo "> pass against pinned AD4M. This failure may be WE's own — check the required"
                echo "> Build on \`dev\` before treating it as upstream drift."
              fi
              echo

              # The suspect list: what landed on AD4M since this job last agreed WE was fine.
              # Printed only when it is non-empty — a heading over nothing reads as a failed
              # lookup, and the list is genuinely empty whenever the drift is older than the
              # last green run.
              SINCE=''
              [ "$MODE" = 'pr' ] || SINCE="$(gh api \
                "repos/${{ github.repository }}/actions/workflows/ad4m-compat.yaml/runs?event=workflow_dispatch&status=success&per_page=1" \
                --jq '.workflow_runs[0].created_at // empty' 2>/dev/null || true)"
              if [ -n "$SINCE" ]; then
                COMMITS="$(gh api "repos/coasys/ad4m/commits?sha=$AD4M_REF&since=$SINCE&per_page=30" \
                  --jq '.[] | "- [`\(.sha[0:8])`](\(.html_url)) \(.commit.message | split("\n")[0])"' \
                  2>/dev/null || true)"
                if [ -n "$COMMITS" ]; then
                  echo "### AD4M commits since this last passed ($SINCE)"
                  echo
                  echo "$COMMITS"
                  echo
                fi
              fi

              echo "### Error"
              echo
              echo '```'
              # The lines a reader wants, out of a log whose first two thousand lines are
              # install chatter. Falls back to the tail when nothing matches the patterns.
              if [ -f compat.log ] && grep -qE 'error TS[0-9]+|ERR_PNPM|FAIL |✗ |AssertionError' compat.log; then
                grep -E 'error TS[0-9]+|ERR_PNPM|FAIL |✗ |AssertionError' compat.log | head -25
              elif [ -f compat.log ]; then
                tail -25 compat.log
              else
                echo "(no log captured — the failure happened before the build started)"
              fi
              echo '```'
            fi
          } > report.md

          cat report.md >> "$GITHUB_STEP_SUMMARY"
          echo "stage=$STAGE" >> "$GITHUB_OUTPUT"
