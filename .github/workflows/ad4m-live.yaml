# `pnpm verify:ad4m` in CI: WE's live tests against an executor built from the AD4M commit the pin
# stands for (`scripts/ad4m-pin.mjs`). Two files run (`packages/backend-system/ad4m/tests/live/`): the capability
# check, which says whether every query feature `ad4mCapabilities` claims really holds, and the
# shared backend conformance suite, which says whether AD4M behaves the way the contract says
# through the same ports the app uses. docs/contributing/ad4m-and-deploys.md has what each result
# means.
#
# Not a required check, and not meant to become one: the suite lists cases AD4M is known to fail,
# one of them intermittent, and a check that can go red for a reason in another repository should
# inform a merge rather than decide it — the same reasoning that took the AD4M source build out of
# `build.yaml`.
#
# ## The executor
#
# `.github/actions/ad4m-executor` provides it — the same action, cache key and path the desktop
# package uses, so the tests run the binary the app ships and either workflow's build serves the
# other. It is cached by AD4M commit, and on a miss it is first downloaded: ad4m's own CI publishes
# the executor it builds for every pushed commit, and fetching it takes seconds. Only a commit with
# nothing to download — built before ad4m published executors, or whose artifacts have expired — is
# built here, which takes most of an hour. Only the binary is cached; the Rust target directory is
# far past what a repository's Actions cache holds. A build that fails caches nothing.
#
# A cache is read only from the run's own branch and its base branch, so where it is saved decides
# who can use it. One saved on a PR serves re-runs of that PR alone; one saved on `dev` serves every
# PR. So the bump workflow builds a new version's executor on `dev` as soon as it sees the version
# (`ad4m-executor.yaml`), before the bump PR's own run starts: that run, and every PR after it,
# restores it. A PR that pins an ad4m pull request's head builds that commit's executor once, for
# itself. This also runs on a push to `dev`, which is then a restore — and the build for a
# version that reached `dev` some other way.
#
# Ubuntu 24.04 because the executor needs glibc 2.38 or later, to link and to run: the prebuilt V8
# calls `__isoc23_*` (coasys/ad4m#1305).
name: AD4M live

on:
  pull_request:
    # What the tests exercise: the adapter, the contract, the entities its classes are generated
    # from, and the pin itself — plus what builds the executor. A template change moves none of it.
    # A change only the calls job exercises runs the backend suite too; paths are per workflow.
    paths:
      - 'packages/backend-system/**'
      - 'packages/entities/**'
      - 'package.json'
      - '.github/workflows/ad4m-live.yaml'
      - '.github/actions/ad4m-executor/**'
      - 'scripts/ad4m-executor*'
      # And what the journeys exercise: the modules, the shell, the web app and the Coasys app's
      # seed and bundle, through the helpers they share and the runner.
      - 'packages/module-system/**'
      - 'packages/app-shell/**'
      - 'apps/we-web/**'
      - 'packages/e2e/**'
      - 'scripts/e2e*'
      - 'seeds/coasys.seed.json'
      - 'bundles/**'
  # The same paths on `dev`, so a merged bump caches its executor where every PR can read it.
  push:
    branches: [dev]
    paths:
      - 'packages/backend-system/**'
      - 'packages/entities/**'
      - 'package.json'
      - '.github/workflows/ad4m-live.yaml'
      - '.github/actions/ad4m-executor/**'
      - 'scripts/ad4m-executor*'
      # And what the journeys exercise: the modules, the shell, the web app and the Coasys app's
      # seed and bundle, through the helpers they share and the runner.
      - 'packages/module-system/**'
      - 'packages/app-shell/**'
      - 'apps/we-web/**'
      - 'packages/e2e/**'
      - 'scripts/e2e*'
      - 'seeds/coasys.seed.json'
      - 'bundles/**'
  # The ad4m bump workflow starts this on its branch, as it does CI — a PR it opens with
  # GITHUB_TOKEN starts nothing. And by hand, from the Actions tab.
  workflow_dispatch:

# Deliberately no workflow-level `concurrency`. Cancelling a run cancels every job in it, and a push
# landing forty minutes into a cold build would throw away the one thing every later run needs. Only
# the test job is cancelled by a newer push; a build always finishes and fills the cache.

permissions:
  contents: read

jobs:
  resolve:
    name: Resolve the pinned executor
    runs-on: ubuntu-24.04
    outputs:
      commit: ${{ steps.executor.outputs.sha }}
      cached: ${{ steps.executor.outputs.cache-hit }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            package.json
            scripts/ad4m-pin.mjs
            scripts/ad4m-executor-download.mjs
            scripts/ad4m-executor-download.test.mjs
            scripts/ad4m-executor.mjs
            scripts/ad4m-executor.test.mjs
            scripts/seed.cjs
            .github/actions/ad4m-executor
          sparse-checkout-cone-mode: false

      # The download script's own tests, here because the root has no test runner, and because this
      # is the job that decides whether to fetch: a script that stopped refusing a bad checksum
      # would hand the live tests whatever it downloaded.
      - uses: actions/setup-node@v7
        with:
          # zstd in node:zlib, which the tests compress with.
          node-version: 24
      - name: The executor download still checks what it fetches
        run: node --test scripts/ad4m-executor-download.test.mjs scripts/ad4m-executor.test.mjs

      - name: Is the pinned executor cached
        id: executor
        uses: ./.github/actions/ad4m-executor
        with:
          mode: lookup

      - name: Summary
        env:
          SHA: ${{ steps.executor.outputs.sha }}
          HIT: ${{ steps.executor.outputs.cache-hit }}
        run: echo "### coasys/ad4m@${SHA:0:9} — $([ "$HIT" = true ] && echo 'cached' || echo 'not cached yet, downloading or building')" >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build the executor
    needs: resolve
    if: needs.resolve.outputs.cached != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    # Two runs on the same commit wait for each other rather than both spending an hour on it; the
    # second restores what the first saved. Never cancelled — see the top of the file.
    concurrency:
      group: ad4m-executor-${{ needs.resolve.outputs.commit }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          # The action, and the script it downloads ad4m's own build with.
          sparse-checkout: |
            .github/actions/ad4m-executor
            scripts/ad4m-executor-download.mjs
          sparse-checkout-cone-mode: false
      - uses: ./.github/actions/ad4m-executor
        with:
          ref: ${{ needs.resolve.outputs.commit }}

  live:
    name: Live tests
    needs: [resolve, build]
    # Runs after a build, and also when the build was skipped because the binary was cached.
    if: ${{ !cancelled() && needs.resolve.result == 'success' && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # A newer push to the same PR replaces this run's tests — and only its tests.
    concurrency:
      group: ad4m-live-tests-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - name: Restore the executor
        id: executor
        uses: ./.github/actions/ad4m-executor
        with:
          ref: ${{ needs.resolve.outputs.commit }}
          mode: restore

      # The live tests import these by package name, which resolves to their built output. Only
      # the adapter's own dependencies and the suite — not the monorepo.
      - name: Build what the tests import
        run: pnpm --filter "@we/backend-ad4m^..." --filter "@we/backend-conformance..." build

      - name: Live tests
        env:
          AD4M_EXECUTOR: ${{ steps.executor.outputs.path }}
          # What the executor was built from, for the banner: the binary itself does not say yet.
          AD4M_COMMIT: ${{ needs.resolve.outputs.commit }}
        run: |
          chmod +x "$AD4M_EXECUTOR"
          pnpm verify:ad4m

  # One account calling from two tabs and two devices, in the built web app against the same
  # executor in multi-user mode, on the SFU and on the mesh (`apps/we-web/e2e/calls.e2e.mjs`).
  # Its own job, so a call failing says so by name and does not hide the backend suite's result.
  calls:
    name: Calls across tabs and devices
    needs: [resolve, build]
    if: ${{ !cancelled() && needs.resolve.result == 'success' && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    concurrency:
      group: ad4m-live-calls-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - name: Restore the executor
        id: executor
        uses: ./.github/actions/ad4m-executor
        with:
          ref: ${{ needs.resolve.outputs.commit }}
          mode: restore

      - name: Build the web app
        run: pnpm build:web

      # Chrome is on the runner image (`/usr/bin/google-chrome`), which `chromePath()` in `@we/e2e`
      # finds. A failing step leaves a screenshot, the page's aria snapshot and the executor log.
      - name: Calls
        env:
          AD4M_EXECUTOR: ${{ steps.executor.outputs.path }}
          WE_E2E_ARTIFACTS: ${{ runner.temp }}/calls-artifacts
        run: |
          chmod +x "$AD4M_EXECUTOR"
          pnpm --filter @we/app-web test:live

      - name: Keep what the failing step saw
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: calls-artifacts
          path: ${{ runner.temp }}/calls-artifacts
          if-no-files-found: ignore

  # The Coasys app, vertical by vertical, in the stub tier: a scripted model and typed call lines,
  # so its results are exact and a red run is a product break rather than model variance
  # (`apps/we-web/e2e/coasys-spaces/README.md`). The real tier, with a model and a recorded call,
  # runs in ad4m's nightly against ad4m `dev` (`scripts/coasys-spaces.sh` there), not here.
  spaces:
    name: Coasys spaces (stub tier)
    needs: [resolve, build]
    if: ${{ !cancelled() && needs.resolve.result == 'success' && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    runs-on: ubuntu-24.04
    # Many accounts and spaces, each waiting on sync between them: long, and a hang says so at the
    # suite's own per-wait timeouts well before this one.
    timeout-minutes: 120
    concurrency:
      group: ad4m-live-spaces-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - name: Restore the executor
        id: executor
        uses: ./.github/actions/ad4m-executor
        with:
          ref: ${{ needs.resolve.outputs.commit }}
          mode: restore

      - name: Build the Coasys app
        env:
          WE_SEED: seeds/coasys.seed.json
        run: pnpm build:web

      - name: Coasys spaces
        env:
          AD4M_EXECUTOR: ${{ steps.executor.outputs.path }}
          COASYS_SPACES_TIER: stub
          COASYS_SPACES_ARTIFACTS: ${{ runner.temp }}/spaces-artifacts
        run: |
          chmod +x "$AD4M_EXECUTOR"
          pnpm --filter @we/app-web test:spaces

      - name: Keep what the failing step saw
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: spaces-artifacts
          path: ${{ runner.temp }}/spaces-artifacts
          if-no-files-found: ignore
