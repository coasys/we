<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 660" width="940" height="660" role="img" aria-labelledby="t d">
  <title id="t">Phone spike 1: the layers of the pinned connection</title>
  <desc id="d">On the phone, WE's web build runs in the WebView. Two adapters replace WebSocket and fetch for the paired desktop only. Calls cross the Capacitor bridge into the CoasysTransport plugin, then through uniffi into the Rust phone-transport crate, which accepts the desktop's certificate only when its key matches the pin and it names the host dialled, over TLS 1.3. On the desktop, a TLS listener (here spike-endpoint) passes each connection to the executor. The pin comes from the desktop's QR code. In spike 2 the keys move into the plugin, out of JavaScript.</desc>
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <clipPath id="frame"><rect width="940" height="660" rx="16"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="940" height="660" fill="#FFFFFF"/>
    <rect width="940" height="5" fill="url(#grad)"/>
  </g>
  <rect x="0.5" y="0.5" width="939" height="659" rx="16" fill="none" stroke="#E2E8F0"/>

  <text x="470" y="40" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#1E293B">One pinned connection, phone to desktop</text>
  <text x="470" y="62" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#64748B">The WebView never checks the certificate. Rust does.</text>

  <!-- ============ PHONE ============ -->
  <rect x="30" y="96" width="460" height="530" rx="16" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="1.5"/>
  <rect x="210" y="82" width="100" height="28" rx="14" fill="#6366F1"/>
  <text x="260" y="101" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">PHONE</text>

  <!-- layer 1 -->
  <rect x="56" y="126" width="408" height="52" rx="10" fill="#FFFFFF" stroke="#C7D2FE"/>
  <circle cx="82" cy="152" r="14" fill="#6366F1"/>
  <text x="82" y="157" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">1</text>
  <text x="106" y="148" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="600" fill="#1E293B">WE web build, in the WebView</text>
  <text x="106" y="166" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#64748B">unchanged · plus the pairing and diagnostic pages</text>

  <!-- layer 2 -->
  <rect x="56" y="192" width="408" height="52" rx="10" fill="#FFFFFF" stroke="#C7D2FE"/>
  <circle cx="82" cy="218" r="14" fill="#6366F1"/>
  <text x="82" y="223" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">2</text>
  <text x="106" y="214" font-family="Courier New, Courier, monospace" font-size="13" font-weight="700" fill="#1E293B">installPinnedWebSocket · installPinnedFetch</text>
  <text x="106" y="232" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#64748B">switch only the paired desktop's origin (boot.ts)</text>

  <!-- JS / native boundary -->
  <line x1="44" y1="258" x2="476" y2="258" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 4"/>
  <rect x="356" y="250" width="110" height="16" rx="8" fill="#EEF2FF"/>
  <text x="411" y="262" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#475569">JS ↑ · native ↓</text>

  <!-- layer 3 -->
  <rect x="56" y="272" width="408" height="52" rx="10" fill="#FFFFFF" stroke="#C7D2FE"/>
  <circle cx="82" cy="298" r="14" fill="#6366F1"/>
  <text x="82" y="303" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">3</text>
  <text x="106" y="294" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="600" fill="#1E293B">Capacitor bridge</text>
  <text x="106" y="312" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#64748B">one call per send, one event per message · about 1.3 ms</text>

  <!-- layer 4 -->
  <rect x="56" y="338" width="408" height="52" rx="10" fill="#FFFFFF" stroke="#C7D2FE"/>
  <circle cx="82" cy="364" r="14" fill="#6366F1"/>
  <text x="82" y="369" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">4</text>
  <text x="106" y="360" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="600" fill="#1E293B">CoasysTransport plugin</text>
  <text x="106" y="378" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#64748B">Kotlin (built) · Swift (not compiled)</text>
  <rect x="330" y="350" width="120" height="28" rx="14" fill="#FFFFFF" stroke="#6366F1" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="390" y="368" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#4F46E5">spike 2: keys here</text>

  <!-- layer 5 -->
  <rect x="56" y="404" width="408" height="52" rx="10" fill="#FFFFFF" stroke="#C7D2FE"/>
  <circle cx="82" cy="430" r="14" fill="#6366F1"/>
  <text x="82" y="435" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">5</text>
  <text x="106" y="426" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="600" fill="#1E293B">uniffi bindings</text>
  <text x="106" y="444" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#64748B">generated Kotlin and Swift · Connection, http_request</text>

  <!-- layer 6 -->
  <rect x="56" y="470" width="408" height="70" rx="10" fill="#FFFFFF" stroke="#6366F1" stroke-width="2"/>
  <circle cx="82" cy="505" r="14" fill="#6366F1"/>
  <text x="82" y="510" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">6</text>
  <text x="106" y="494" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="600" fill="#1E293B">Rust phone-transport</text>
  <text x="106" y="512" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#64748B">rustls (ring) · TLS 1.3 only · no platform trust store</text>
  <text x="106" y="529" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#64748B">accept only if SPKI pin matches and SAN names the host</text>

  <!-- vertical spine -->
  <line x1="82" y1="166" x2="82" y2="204" stroke="#C7D2FE" stroke-width="2" stroke-dasharray="4 4"/>

  <text x="56" y="566" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#475569">Spike 2 moves the keys and the executor token into</text>
  <text x="56" y="582" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#475569">the plugin (Keystore / Keychain). In spike 1 the token</text>
  <text x="56" y="598" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#475569">is still in localStorage.</text>

  <!-- ============ DESKTOP ============ -->
  <rect x="610" y="96" width="300" height="530" rx="16" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1.5"/>
  <rect x="710" y="82" width="100" height="28" rx="14" fill="#10B981"/>
  <text x="760" y="101" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">DESKTOP</text>

  <!-- QR -->
  <rect x="634" y="126" width="252" height="70" rx="10" fill="#FFFFFF" stroke="#A7F3D0"/>
  <g fill="#1E293B">
    <rect x="650" y="140" width="12" height="12"/><rect x="666" y="140" width="6" height="6"/><rect x="676" y="146" width="12" height="6"/>
    <rect x="650" y="158" width="6" height="12"/><rect x="662" y="164" width="12" height="6"/><rect x="678" y="158" width="10" height="12"/>
    <rect x="650" y="174" width="12" height="8"/><rect x="668" y="176" width="6" height="6"/>
  </g>
  <text x="702" y="152" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="600" fill="#1E293B">Pairing QR code</text>
  <text x="702" y="170" font-family="Courier New, Courier, monospace" font-size="11" fill="#64748B">{ "url": "wss://…",</text>
  <text x="702" y="184" font-family="Courier New, Courier, monospace" font-size="11" fill="#64748B">  "pin": "&lt;43 chars&gt;" }</text>

  <!-- TLS listener -->
  <rect x="634" y="460" width="252" height="80" rx="10" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
  <text x="652" y="486" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="600" fill="#1E293B">TLS listener</text>
  <text x="652" y="504" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#64748B">here: spike-endpoint</text>
  <text x="652" y="520" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#64748B">self-signed cert for private IPs and</text>
  <text x="652" y="534" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#64748B">10.0.2.2 · its key is the pin</text>

  <!-- executor -->
  <rect x="634" y="564" width="252" height="46" rx="10" fill="#FFFFFF" stroke="#A7F3D0"/>
  <text x="652" y="584" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="600" fill="#1E293B">ad4m executor</text>
  <text x="652" y="600" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#64748B">ws://127.0.0.1 · byte for byte</text>
  <line x1="760" y1="540" x2="760" y2="558" stroke="#94A3B8" stroke-width="1.5"/>
  <polygon points="760,563 755,555 765,555" fill="#94A3B8"/>

  <!-- QR -> phone (pairing) -->
  <path d="M634 161 L478 161" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="5 4"/>
  <polygon points="470,161 479,156 479,166" fill="#94A3B8"/>
  <rect x="496" y="134" width="106" height="22" rx="11" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="549" y="149" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#475569">scan: url + pin</text>

  <!-- pin travels down: connect(url, pin) -->
  <line x1="548" y1="200" x2="548" y2="284" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line x1="548" y1="350" x2="548" y2="452" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="5 4"/>
  <polygon points="548,460 543,451 553,451" fill="#94A3B8"/>
  <text x="548" y="302" text-anchor="middle" font-family="Courier New, Courier, monospace" font-size="11" fill="#64748B">connect(url, pin)</text>
  <text x="548" y="318" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#64748B">the pin goes</text>
  <text x="548" y="332" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#64748B">down to Rust</text>

  <!-- what the listener sees on a refusal -->
  <rect x="634" y="226" width="252" height="132" rx="10" fill="#FFFFFF" stroke="#A7F3D0"/>
  <text x="652" y="252" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="600" fill="#1E293B">When the phone refuses</text>
  <text x="652" y="276" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#047857">wrong pin</text>
  <text x="652" y="291" font-family="Courier New, Courier, monospace" font-size="10" fill="#64748B">pin-mismatch · server: AccessDenied</text>
  <text x="652" y="312" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#047857">right key, host not named</text>
  <text x="652" y="327" font-family="Courier New, Courier, monospace" font-size="10" fill="#64748B">host-mismatch · server: BadCertificate</text>
  <text x="652" y="348" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#64748B">no handshake ends · 0 bytes upstream</text>

  <!-- network: Rust <-> listener -->
  <line x1="470" y1="500" x2="626" y2="500" stroke="#94A3B8" stroke-width="2"/>
  <polygon points="633,500 624,495 624,505" fill="#94A3B8"/>
  <polygon points="465,500 474,495 474,505" fill="#94A3B8"/>
  <rect x="490" y="472" width="116" height="22" rx="11" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="548" y="487" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#475569">TLS 1.3 · wss://</text>
  <text x="548" y="520" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#64748B">home network</text>
  <text x="548" y="534" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#64748B">emulator: 10.0.2.2</text>
</svg>
