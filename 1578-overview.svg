<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 900" width="940" height="900">
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <clipPath id="frame">
      <rect width="940" height="900" rx="16"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="940" height="900" fill="#FFFFFF"/>
    <rect width="940" height="5" fill="url(#grad)"/>
  </g>
  <rect x="0.5" y="0.5" width="939" height="899" rx="16" fill="none" stroke="#E2E8F0" stroke-width="1"/>

  <!-- Title -->
  <text x="470" y="42" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#1E293B">The executor's run contract</text>
  <text x="470" y="64" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#64748B">A supervisor starts the executor, watches it, and reads why it stopped</text>

  <!-- ===== Band A: who starts whom ===== -->
  <!-- Supervisor card -->
  <rect x="40" y="100" width="250" height="196" rx="16" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="1.5"/>
  <rect x="112" y="86" width="106" height="28" rx="14" fill="#6366F1"/>
  <text x="165" y="105" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">SUPERVISOR</text>
  <text x="60" y="142" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="600" fill="#1E293B">Desktop app, systemd,</text>
  <text x="60" y="161" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="600" fill="#1E293B">or a host</text>
  <text x="60" y="188" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#475569">Starts the executor as a child.</text>
  <text x="60" y="206" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#475569">Holds the stdin pipe and never writes.</text>
  <text x="60" y="224" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#475569">Reads the exit code.</text>
  <text x="60" y="242" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#475569">Restarts on 75 and on a crash.</text>
  <text x="60" y="272" font-family="Courier New, Courier, monospace" font-size="11" fill="#4338CA">gives a new credential</text>
  <text x="60" y="286" font-family="Courier New, Courier, monospace" font-size="11" fill="#4338CA">at each start</text>

  <!-- Executor card -->
  <rect x="650" y="100" width="250" height="196" rx="16" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1.5"/>
  <rect x="722" y="86" width="106" height="28" rx="14" fill="#10B981"/>
  <text x="775" y="105" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">EXECUTOR</text>
  <text x="670" y="142" font-family="Courier New, Courier, monospace" font-size="14" font-weight="700" fill="#1E293B">ad4m-executor run</text>
  <text x="670" y="172" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#047857">One per data folder</text>
  <text x="670" y="188" font-family="Courier New, Courier, monospace" font-size="11" fill="#475569">&lt;app_data_path&gt;/executor.lock</text>
  <text x="670" y="214" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#047857">One log file per run</text>
  <text x="670" y="230" font-family="Courier New, Courier, monospace" font-size="11" fill="#475569">D/executor-0.log</text>
  <text x="670" y="244" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#475569">5 runs kept, 50 MiB each</text>
  <text x="670" y="270" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#047857">No core dumps (Linux)</text>
  <text x="670" y="286" font-family="Courier New, Courier, monospace" font-size="11" fill="#475569">RLIMIT_CORE = 0</text>

  <!-- Arrows between the cards -->
  <!-- 1 spawn -->
  <line x1="290" y1="136" x2="642" y2="136" stroke="#94A3B8" stroke-width="1.5"/>
  <polygon points="648,136 640,130 640,142" fill="#94A3B8"/>
  <text x="470" y="127" text-anchor="middle" font-family="Courier New, Courier, monospace" font-size="11" fill="#1E293B">spawn: run --watch-stdin true --log-dir D</text>
  <text x="470" y="152" text-anchor="middle" font-family="Courier New, Courier, monospace" font-size="11" fill="#64748B">env AD4M_ADMIN_CREDENTIAL (not on argv)</text>

  <!-- 2 stdin -->
  <line x1="290" y1="184" x2="642" y2="184" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="4 4"/>
  <polygon points="648,184 640,178 640,190" fill="#94A3B8"/>
  <text x="470" y="176" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#1E293B">stdin pipe, open while the supervisor lives</text>
  <text x="470" y="200" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#64748B">pipe closes: graceful stop, exit 0</text>

  <!-- 3 health -->
  <line x1="290" y1="228" x2="642" y2="228" stroke="#94A3B8" stroke-width="1.5"/>
  <polygon points="648,228 640,222 640,234" fill="#94A3B8"/>
  <text x="470" y="220" text-anchor="middle" font-family="Courier New, Courier, monospace" font-size="11" fill="#1E293B">GET /health  →  {"status":"ok"}</text>
  <text x="470" y="244" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#64748B">ready once the API listens: the last step of a start</text>

  <!-- 4 exit code back -->
  <line x1="298" y1="272" x2="650" y2="272" stroke="#6366F1" stroke-width="2"/>
  <polygon points="292,272 300,266 300,278" fill="#6366F1"/>
  <rect x="414" y="259" width="112" height="26" rx="13" fill="#FFFFFF" stroke="#C7D2FE" stroke-width="1"/>
  <text x="470" y="276" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#4338CA">exit code</text>

  <!-- ===== Band B: exit codes ===== -->
  <text x="40" y="340" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="600" fill="#1E293B">What each exit code tells the supervisor</text>

  <!-- 6 cells: width 136, step 144.8 -->
  <g font-family="Arial, Helvetica, sans-serif">
    <!-- 0 -->
    <rect x="40" y="356" width="136" height="128" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
    <text x="56" y="386" font-size="22" font-weight="700" fill="#1E293B">0</text>
    <text x="56" y="406" font-size="12" font-weight="700" fill="#1E293B">stopped</text>
    <text x="56" y="423" font-size="11" fill="#64748B">runtime.quit, SIGTERM,</text>
    <text x="56" y="437" font-size="11" fill="#64748B">SIGINT, stdin closed</text>
    <text x="56" y="468" font-size="11" font-weight="700" fill="#475569">done</text>

    <!-- 75 -->
    <rect x="185" y="356" width="136" height="128" rx="12" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5"/>
    <text x="201" y="386" font-size="22" font-weight="700" fill="#1E293B">75</text>
    <rect x="245" y="368" width="64" height="22" rx="11" fill="#10B981"/>
    <text x="277" y="383" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF">RESTART</text>
    <text x="201" y="406" font-size="12" font-weight="700" fill="#1E293B">restart requested</text>
    <text x="201" y="423" font-size="11" fill="#64748B">runtime.restart</text>
    <text x="201" y="454" font-size="11" font-weight="700" fill="#047857">start again with the</text>
    <text x="201" y="468" font-size="11" font-weight="700" fill="#047857">same arguments</text>

    <!-- 78 -->
    <rect x="330" y="356" width="136" height="128" rx="12" fill="#EEF2FF" stroke="#6366F1" stroke-width="1.5"/>
    <text x="346" y="386" font-size="22" font-weight="700" fill="#1E293B">78</text>
    <rect x="384" y="368" width="70" height="22" rx="11" fill="#6366F1"/>
    <text x="419" y="383" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF">NO RETRY</text>
    <text x="346" y="406" font-size="12" font-weight="700" fill="#1E293B">config refused</text>
    <text x="346" y="423" font-size="11" fill="#64748B">bad config, flag or</text>
    <text x="346" y="437" font-size="11" fill="#64748B">AD4M_* variable</text>
    <text x="346" y="454" font-size="11" font-weight="700" fill="#4338CA">fails the same way</text>
    <text x="346" y="468" font-size="11" font-weight="700" fill="#4338CA">at every start</text>

    <!-- 79 -->
    <rect x="475" y="356" width="136" height="128" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
    <text x="491" y="386" font-size="22" font-weight="700" fill="#1E293B">79</text>
    <text x="491" y="406" font-size="12" font-weight="700" fill="#1E293B">data folder in use</text>
    <text x="491" y="423" font-size="11" fill="#64748B">another executor holds</text>
    <text x="491" y="437" font-size="11" fill="#64748B">executor.lock</text>
    <text x="491" y="468" font-size="11" font-weight="700" fill="#475569">report it</text>

    <!-- 80 -->
    <rect x="620" y="356" width="136" height="128" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
    <text x="636" y="386" font-size="22" font-weight="700" fill="#1E293B">80</text>
    <text x="636" y="406" font-size="12" font-weight="700" fill="#1E293B">port taken</text>
    <text x="636" y="423" font-size="11" fill="#64748B">the API listener</text>
    <text x="636" y="437" font-size="11" fill="#64748B">cannot bind its port</text>
    <text x="636" y="454" font-size="11" font-weight="700" fill="#475569">pick another port,</text>
    <text x="636" y="468" font-size="11" font-weight="700" fill="#475569">then start again</text>

    <!-- other -->
    <rect x="765" y="356" width="136" height="128" rx="12" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5"/>
    <text x="781" y="386" font-size="22" font-weight="700" fill="#1E293B">other</text>
    <rect x="845" y="368" width="44" height="22" rx="11" fill="#10B981"/>
    <text x="867" y="383" text-anchor="middle" font-size="9" font-weight="700" fill="#FFFFFF">DELAY</text>
    <text x="781" y="406" font-size="12" font-weight="700" fill="#1E293B">crash</text>
    <text x="781" y="423" font-size="11" fill="#64748B">any other code,</text>
    <text x="781" y="437" font-size="11" fill="#64748B">or a signal</text>
    <text x="781" y="454" font-size="11" font-weight="700" fill="#047857">read executor-0.log,</text>
    <text x="781" y="468" font-size="11" font-weight="700" fill="#047857">restart with a delay</text>
  </g>

  <!-- ===== Band C: config over RPC and who may call ===== -->
  <!-- Config card -->
  <rect x="40" y="530" width="420" height="340" rx="16" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1.5"/>
  <rect x="163" y="516" width="174" height="28" rx="14" fill="#10B981"/>
  <text x="250" y="535" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">CONFIG OVER RPC</text>

  <circle cx="76" cy="578" r="16" fill="#10B981"/>
  <text x="76" y="583" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">1</text>
  <text x="104" y="574" font-family="Courier New, Courier, monospace" font-size="13" font-weight="700" fill="#1E293B">runtime.config</text>
  <text x="104" y="591" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#475569">values, each key with its class, restartPending</text>

  <line x1="76" y1="596" x2="76" y2="618" stroke="#A7F3D0" stroke-width="2" stroke-dasharray="4 4"/>

  <circle cx="76" cy="636" r="16" fill="#10B981"/>
  <text x="76" y="641" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">2</text>
  <text x="104" y="632" font-family="Courier New, Courier, monospace" font-size="13" font-weight="700" fill="#1E293B">runtime.setConfig {set, unset}</text>
  <text x="104" y="649" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#475569">atomic write of the --config file, mode 0600</text>

  <!-- key class table -->
  <rect x="104" y="662" width="336" height="44" rx="8" fill="#FFFFFF" stroke="#A7F3D0" stroke-width="1"/>
  <text x="116" y="680" font-family="Courier New, Courier, monospace" font-size="11" font-weight="700" fill="#047857">restart</text>
  <text x="182" y="680" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#475569">any operator session writes it</text>
  <text x="116" y="697" font-family="Courier New, Courier, monospace" font-size="10" fill="#64748B">mcp_enabled, mcp_port, log_config, auto_permit_…</text>

  <rect x="104" y="712" width="336" height="44" rx="8" fill="#FFFFFF" stroke="#C7D2FE" stroke-width="1"/>
  <text x="116" y="730" font-family="Courier New, Courier, monospace" font-size="11" font-weight="700" fill="#4338CA">machine</text>
  <text x="182" y="730" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#475569">only the operator on this machine</text>
  <text x="116" y="747" font-family="Courier New, Courier, monospace" font-size="10" fill="#64748B">paths, listeners, ports, identity, log_dir, …</text>

  <text x="104" y="776" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#475569">Refused per key:</text>
  <text x="104" y="792" font-family="Courier New, Courier, monospace" font-size="11" fill="#1E293B">local-only · pinned-by-config ·</text>
  <text x="104" y="806" font-family="Courier New, Courier, monospace" font-size="11" fill="#1E293B">invalid · unknown-key</text>

  <line x1="76" y1="654" x2="76" y2="812" stroke="#A7F3D0" stroke-width="2" stroke-dasharray="4 4"/>

  <circle cx="76" cy="830" r="16" fill="#10B981"/>
  <text x="76" y="835" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">3</text>
  <text x="104" y="826" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#1E293B">Every key waits for the next start</text>
  <text x="104" y="843" font-family="Courier New, Courier, monospace" font-size="11" fill="#475569">config-changed, restartPending: true</text>
  <text x="104" y="858" font-family="Courier New, Courier, monospace" font-size="11" fill="#475569">runtime.restart → exit 75</text>

  <!-- Who may call card -->
  <rect x="480" y="530" width="420" height="340" rx="16" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="1.5"/>
  <rect x="595" y="516" width="190" height="28" rx="14" fill="#6366F1"/>
  <text x="690" y="535" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">LOCAL-ONLY METHODS</text>

  <text x="500" y="574" font-family="Courier New, Courier, monospace" font-size="12" font-weight="700" fill="#1E293B">agent.unlock</text>
  <text x="620" y="574" font-family="Courier New, Courier, monospace" font-size="12" font-weight="700" fill="#1E293B">runtime.quit</text>
  <text x="500" y="592" font-family="Courier New, Courier, monospace" font-size="12" font-weight="700" fill="#1E293B">identity.rekey</text>
  <text x="620" y="592" font-family="Courier New, Courier, monospace" font-size="12" font-weight="700" fill="#1E293B">identity.custodyStatus</text>
  <text x="500" y="610" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#475569">and the machine keys of runtime.setConfig</text>

  <!-- caller rows -->
  <text x="500" y="638" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#64748B">CALLER</text>
  <text x="880" y="638" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#64748B">ANSWER</text>

  <rect x="500" y="648" width="380" height="30" rx="8" fill="#FFFFFF" stroke="#A7F3D0" stroke-width="1"/>
  <text x="512" y="667" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#1E293B">admin credential, loopback listener</text>
  <text x="868" y="667" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#047857">answers</text>

  <rect x="500" y="684" width="380" height="30" rx="8" fill="#FFFFFF" stroke="#A7F3D0" stroke-width="1"/>
  <text x="512" y="703" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#1E293B">no token, loopback, executor without a credential</text>
  <text x="868" y="703" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#047857">answers</text>

  <rect x="500" y="720" width="380" height="30" rx="8" fill="#FFFFFF" stroke="#C7D2FE" stroke-width="1"/>
  <text x="512" y="739" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#1E293B">admin credential, network listener</text>
  <text x="868" y="739" text-anchor="end" font-family="Courier New, Courier, monospace" font-size="11" font-weight="700" fill="#4338CA">403 local-only</text>

  <rect x="500" y="756" width="380" height="30" rx="8" fill="#FFFFFF" stroke="#C7D2FE" stroke-width="1"/>
  <text x="512" y="775" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#1E293B">an app grant that passes the guard</text>
  <text x="868" y="775" text-anchor="end" font-family="Courier New, Courier, monospace" font-size="11" font-weight="700" fill="#4338CA">403 local-only</text>

  <text x="500" y="804" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#475569">The guard runs first, then the local-only check.</text>

  <line x1="500" y1="816" x2="880" y2="816" stroke="#C7D2FE" stroke-width="1"/>
  <text x="500" y="836" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#4338CA">Custody channel</text>
  <text x="600" y="836" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#475569">identity.custodyStatus also needs</text>
  <text x="500" y="853" font-family="Courier New, Courier, monospace" font-size="11" fill="#475569">--custody-channel</text>
  <text x="626" y="853" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#475569">and the admin credential. With multi-user: 78.</text>
</svg>
