[package]
name = "we-ad4m-launcher"
version = "0.1.0"
description = "WE AD4M Launcher"
authors = ["James Weir"]
edition = "2021"

[lib]
name = "app_lib"
crate-type = ["staticlib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ad4m-client = { path = "../../../../ad4m/rust-client" }
tokio = { version = "1", features = ["full"] }
warp = "0.3"
ad4m-executor = { path = "../../../../ad4m/rust-executor" }
uuid = { version = "0.8", features = ["v4"] }
dirs = "5"
