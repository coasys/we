<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Coasys</title>
    <style>
      :root {
        color-scheme: dark;
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
        background: #16151d;
        color: #ecebf3;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        box-sizing: border-box;
      }
      main {
        max-width: 26rem;
      }
      h1 {
        font-size: 1.5rem;
        line-height: 1.25;
        margin: 0 0 16px;
      }
      p {
        font-size: 1rem;
        line-height: 1.5;
        margin: 0 0 16px;
        color: #c9c7d6;
      }
      a.button {
        display: inline-block;
        margin-top: 8px;
        padding: 12px 20px;
        border-radius: 10px;
        background: #8b7cf6;
        color: #110f1a;
        font-weight: 600;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main id="message"></main>
    <script type="module" src="./error.ts"></script>
  </body>
</html>
