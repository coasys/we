# The phone's device keys: an Ed25519 signing key and an X25519 encryption key, made on the phone,
# kept only as seeds sealed by a key the platform holds (on Android, a non-exportable Keystore
# AES-GCM key), and used here and nowhere else. The phone app's `DeviceKey` plugin is the only
# caller, through uniffi; what crosses into JavaScript is public keys and signatures.
#
# Standalone, like `crates/custody`: its own `Cargo.lock` and toolchain, nothing on the desktop links
# it. It does not depend on `we-custody`, which keeps master keys on a computer. Phase 2b's phone
# keeps a master key too, behind a second, biometric-gated Keystore key, and runs
# `ad4m-identity-client`'s flows against the identity store directly through `ViaStore` (the phone
# has no executor of its own): see `README.md` and `apps/we-mobile/docs/phase-2b.md`.
[package]
name = "we-phone-custody"
version = "0.1.0"
edition = "2021"
description = "The phone's sealed device keys, exported to the phone app through uniffi"
publish = false

[lib]
name = "we_phone_custody"
# cdylib: the `.so` the Android app loads through JNA. staticlib: what an iOS XCFramework would
# wrap. lib: the tests.
crate-type = ["lib", "cdylib", "staticlib"]

[features]
default = []
# `uniffi-bindgen`, run on the build host to write the Kotlin bindings.
bindgen = ["uniffi/cli"]

[[bin]]
name = "uniffi-bindgen"
required-features = ["bindgen"]

[dependencies]
uniffi = "0.32"
# The flows (take the master key, ask for it, answer a request, link a scanned device, revoke,
# the private record), run over the store by `ViaStore` (feature `store`), the ports of which this
# crate supplies (`ports.rs`). From the ad4m commit WE pins (`node scripts/ad4m-pin.mjs --commit`),
# as `crates/custody` is. Every ad4m crate here is at the same rev. For a local ad4m checkout,
# override with
#   cargo test --config 'patch."https://github.com/coasys/ad4m".ad4m-identity-client.path="<ad4m>/ad4m-identity-client"' …
# (and the same for each crate below), as `crates/custody/README.md` says.
ad4m-identity-client = { git = "https://github.com/coasys/ad4m", rev = "1fc10759c07a9464fc413010e81189a075a4fa86", features = ["store"] }
# The claim on an offer (`link::make_claim`, `OfferString`, `match_code`), `signing_bytes`, the
# device string and the record's types.
ad4m-identity-core = { git = "https://github.com/coasys/ad4m", rev = "1fc10759c07a9464fc413010e81189a075a4fa86", features = ["build"] }
# `encode_proof_value` (a signature as `z` + base58btc) and the Ed25519 multikey.
ad4m-hash-chain = { git = "https://github.com/coasys/ad4m", rev = "1fc10759c07a9464fc413010e81189a075a4fa86" }
# The request box's types (`DeviceRequest`, `DeviceRequestBody`).
ad4m-ldk = { git = "https://github.com/coasys/ad4m", rev = "1fc10759c07a9464fc413010e81189a075a4fa86" }
# `HttpClient` is an `async_trait(?Send)`; the flows are driven on the calling thread by
# `futures-executor`'s `block_on` (a current-thread executor, no tokio runtime on the phone).
async-trait = "0.1"
futures-executor = "0.3"
ed25519-dalek = { version = "2.2", features = ["zeroize"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
bs58 = "0.5"
zeroize = "1.8"
rand_core = { version = "0.6", features = ["getrandom"] }
thiserror = "2"

[target.'cfg(unix)'.dependencies]
# `flock(2)` for the vault's folder lock: `std::fs::File::lock` has no implementation for
# `target_os = "android"` in the pinned toolchain.
libc = "0.2"

[dev-dependencies]
tempfile = "3"
# The tests run the flows against a real identity store, its router in process (as
# `ad4m-identity-client/tests/store.rs` does), with a holder whose master key is in a `MemoryVault`.
ad4m-identity-client = { git = "https://github.com/coasys/ad4m", rev = "1fc10759c07a9464fc413010e81189a075a4fa86", features = ["store", "test-vault"] }
ad4m-identity-core = { git = "https://github.com/coasys/ad4m", rev = "1fc10759c07a9464fc413010e81189a075a4fa86", features = ["build", "words"] }
identity-store = { git = "https://github.com/coasys/ad4m", rev = "1fc10759c07a9464fc413010e81189a075a4fa86" }
axum = "0.8"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "time"] }

[profile.release]
# The `.so` ships inside the APK twice (arm64 and x86_64): small and stripped.
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "unwind"
