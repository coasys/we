# Same channel as crates/custody (1.96.1). The wasm target is part of the pin
# because `cargo check --target wasm32-unknown-unknown` is part of this workspace's
# gate; rustup installs it with the toolchain.
[toolchain]
channel = "1.96.1"
targets = ["wasm32-unknown-unknown"]
components = ["rustfmt", "clippy"]
