[package]
name = "we-ad4m"
version = "0.1.0"
edition = "2021"
description = "The executor adapter: we_data::Executor over ad4m-client"
publish = false

[dependencies]
we-data.workspace = true
we-template.workspace = true
we-expr.workspace = true
serde.workspace = true
serde_json.workspace = true
indexmap.workspace = true
log.workspace = true
async-trait.workspace = true

# The native transport: a WebSocket client and the runtime it runs on. Native
# only — the crate compiles to an empty shell on wasm32, so the workspace's
# wasm check stays green (`crates/renderer/Cargo.toml`: no tokio on wasm).
#
# `ad4m-client` from the unmerged A6 lineage (branch port/a6-on-a5, which
# contains A4 and A5): typed modelQuery/modelSubscribe with reconnect, the
# Rust `ad4m-connect` flow, and connect and reconnect sharing the
# loopback-pinned dial (20847b994). The A5 head, fb3e212b, lost the
# localhost pin on the first reconnect (`tests/pin.rs`). Move the rev when
# it merges.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ad4m-client = { git = "https://github.com/coasys/ad4m.git", rev = "d2e6fab93a61588d429fd44e7139e5d3bcaa7fcd" }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "net"] }
anyhow = "1"
# Host parsing for `--executor-url` (base.rs). Already in the lockfile:
# reqwest re-exports it, and `ad4m-client` parses with it, so both read a
# host the same way.
url = "2"
# The health check's error type (connect.rs `Health`): a timeout is not a
# wrong service. Already in the lockfile, the version ad4m-client uses; no
# features of its own.
reqwest = { version = "0.11", default-features = false }
# The owned executor's admin credential (supervisor.rs). Already in the
# lockfile, the version reqwest's stack uses.
getrandom = "0.2"
tempfile = { version = "3", optional = true }

[features]
# `we_ad4m::testkit`: start a real executor for a live test. Tests only.
testkit = ["dep:tempfile"]

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
we-ad4m = { path = ".", features = ["testkit"] }
tempfile = "3"
we-session.workspace = true
we-screen.workspace = true
anyhow = "1"
