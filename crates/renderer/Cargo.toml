# The egui/Rust renderer for WE's template language — a second client, beside the
# Solid one, that runs a WE bundle. Own workspace beside `crates/custody`, with its
# own Cargo.lock; nothing here is published.
#
# Dependency direction, never the other way:
#   we-expr <- we-screen <- we-template <- we-data <- we-layout <- we-widgets <- we-app
#   we-style depends on we-expr only; we-ad4m depends on we-data.
# we-expr, we-screen, we-template, we-data, we-style and we-layout must build for
# wasm32-unknown-unknown and must not depend on tokio.
[workspace]
resolver = "2"
members = [
    "we-expr",
    "we-screen",
    "we-template",
    "we-data",
    "we-style",
    "we-layout",
    "we-catalog",
    "we-session",
    "we-widgets",
    "we-ad4m",
    "we-app",
]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
# `preserve_order` makes serde_json::Map an IndexMap, so object key order survives
# a JSON round trip — the template language's objects keep insertion order, as in JS.
serde_json = { version = "1", features = ["preserve_order"] }
indexmap = { version = "2", features = ["serde"] }
thiserror = "2"
log = "0.4"
async-trait = "0.1"
egui = { version = "0.37", features = ["default_fonts"] }
eframe = "0.37"
taffy = "0.15"
egui_kittest = "0.37"
egui-pop-phosphor = { version = "0.15", default-features = false, features = ["regular", "bold", "fill"] }
base64 = "0.22"
egui_extras = { version = "0.37", default-features = false, features = ["image", "http", "webp", "svg"] }

we-expr = { path = "we-expr" }
we-screen = { path = "we-screen" }
we-template = { path = "we-template" }
we-data = { path = "we-data" }
we-style = { path = "we-style" }
we-layout = { path = "we-layout" }
we-catalog = { path = "we-catalog" }
we-session = { path = "we-session" }
we-widgets = { path = "we-widgets" }
we-ad4m = { path = "we-ad4m" }
