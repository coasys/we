[package]
name = "we-app"
version = "0.1.0"
edition = "2021"
description = "The binary: egui/eframe, window, menus, OS integration"
publish = false

[dependencies]
eframe.workspace = true
egui.workspace = true
indexmap.workspace = true
serde.workspace = true
serde_json.workspace = true
we-template.workspace = true
we-egui.workspace = true
we-session.workspace = true
we-style.workspace = true
we-metrics.workspace = true
we-data.workspace = true
we-expr.workspace = true
we-screen.workspace = true

# The connected app (E7): the executor adapter, native only — the wasm
# build is the offline app until E10.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
we-ad4m.workspace = true
# The logger (`logging.rs`): `log` is already in the tree, no logger crate is.
log.workspace = true

[dev-dependencies]
# Harnesses that drive a raw Runtime install the same legacy faces a
# session would (E3c-6).
we-legacy.workspace = true
egui_kittest = { workspace = true, features = ["snapshot", "wgpu"] }
# PNG in/out for the `coasys_shots` side-by-sides — the version egui_kittest
# already pulls in.
image = { version = "0.25", default-features = false, features = ["png"] }
# The render gate pins the C2a snapshot's sha256 (coasys_render.rs).
sha2 = "0.10"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
# A real executor for the connected app's test (EXECUTOR_PATH).
we-ad4m = { workspace = true, features = ["testkit"] }
tempfile = "3"
