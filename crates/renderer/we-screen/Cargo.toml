[package]
name = "we-screen"
version = "0.1.0"
edition = "2021"
description = "ScreenState, Navigator, back stack — the typed screen state of the renderer"
publish = false

[dependencies]
we-expr.workspace = true
serde.workspace = true
serde_json.workspace = true
indexmap.workspace = true
log.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = [
    "Window",
    "Location",
    "History",
    "Storage",
    "EventTarget",
    "PopStateEvent",
] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"
